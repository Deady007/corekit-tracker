<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivyah Task Manager</title>
<meta name="theme-color" content="#1A1A1A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ MARBLE + GLASSMORPHISM + NEOMORPHISM ============
   Polished-marble page background (soft veined gradients); frosted-glass
   panels (translucent + backdrop-blur) floating on it; neomorphic dual
   light/dark shadows give them soft extruded depth. Still 5 colors only —
   white / black / orange / red / blue — glass tints are translucency of
   the same white/black, not new hues. Borders are soft glass rims (a light
   translucent edge) instead of flat hard lines. */
:root{
  --paper:rgba(237,238,241,.6); --paper2:rgba(223,225,230,.72);
  --white:rgba(255,255,255,.78); --ink:#1A1A1A; --dim:#54575c;
  --orange:#FF7A00; --orange-tint:rgba(255,196,130,.55); --red:#E63946; --red-tint:rgba(251,180,184,.55); --blue:#2F80ED; --blue-tint:rgba(179,209,250,.55);
  --line:rgba(255,255,255,.8); --accent:var(--orange);
  --ns-hi:rgba(255,255,255,.85); --ns-lo:rgba(130,134,146,.5);
  --shadow:7px 7px 20px var(--ns-lo),-7px -7px 16px var(--ns-hi),inset 0 1px 0 rgba(255,255,255,.6);
  --shadow-sm:3px 3px 11px var(--ns-lo),-3px -3px 9px var(--ns-hi),inset 0 1px 0 rgba(255,255,255,.55);
  --shadow-inset:inset 3px 3px 7px var(--ns-lo),inset -3px -3px 7px var(--ns-hi);
  --bd:1px solid var(--line);
  --blur:20px;
  --radius:16px;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{
  background:
    /* thin marble veins — varied angles/positions, kept faint */
    linear-gradient(102deg, transparent 28%, rgba(90,92,98,.06) 29%, transparent 30.5%),
    linear-gradient(96deg, transparent 45%, rgba(90,92,98,.045) 45.6%, transparent 46.8%),
    linear-gradient(75deg, transparent 60%, rgba(255,122,0,.05) 60.6%, transparent 62%),
    linear-gradient(112deg, transparent 68%, rgba(90,92,98,.05) 68.5%, transparent 70%),
    linear-gradient(84deg, transparent 15%, rgba(90,92,98,.04) 15.5%, transparent 17%),
    linear-gradient(130deg, transparent 82%, rgba(47,128,237,.04) 82.6%, transparent 84%),
    /* soft color depth */
    radial-gradient(ellipse 900px 550px at 12% 6%, rgba(255,255,255,.85), transparent 60%),
    radial-gradient(ellipse 750px 650px at 90% 12%, rgba(255,122,0,.07), transparent 55%),
    radial-gradient(ellipse 950px 750px at 22% 92%, rgba(30,30,30,.06), transparent 55%),
    radial-gradient(ellipse 750px 550px at 88% 96%, rgba(47,128,237,.06), transparent 55%),
    linear-gradient(160deg,#F5F4F2 0%,#E5E4E2 45%,#EDECEA 100%);
  background-attachment:fixed;
}
/* frosted-glass surfaces: blur whatever marble/content sits behind them */
aside,.topbar,.tile,.block,.block .bhead,th,.pcard,
.kcol,.kcol .khead,.card,.dsec,.dsec-h,.ndrop,.modal,.modal .mhead,.modal .mfoot,
.drawer,.drawer .dhead,.drawer .dfoot,.dtabs,.login,.fchip,.bigpanel,.fm,.fm-head,button:not(.bare){
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{ --paper:#ECEDF0; --paper2:#E2E4E8; --white:#FFFFFF; --orange-tint:#FFE4C2; --red-tint:#FBDADC; --blue-tint:#D9E8FD; --line:rgba(0,0,0,.08); }
}
body{font-family:var(--sans);color:var(--ink);font-size:14px;line-height:1.5}
.mono{font-family:var(--mono)}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.01em}

button{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;
  background:var(--paper);color:var(--ink);border:none;padding:9px 15px;cursor:pointer;box-shadow:var(--shadow-sm);border-radius:12px;transition:box-shadow .12s,transform .1s}
button:hover{box-shadow:var(--shadow)}
button:active{box-shadow:var(--shadow-inset);transform:scale(.99)}
button.primary{background:var(--orange);color:#fff;box-shadow:3px 3px 8px rgba(255,122,0,.35)}
button.primary:hover{background:#e86e00;box-shadow:4px 4px 10px rgba(255,122,0,.4)}
button.primary:active{box-shadow:var(--shadow-inset)}
button.danger{background:var(--paper);color:var(--red)}
button.bare{box-shadow:none;background:transparent;border:1px solid var(--line);padding:5px 10px;font-weight:500}
button.bare:hover{box-shadow:none;background:rgba(0,0,0,.04)}
button.bare:active{box-shadow:none;transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
input,select,textarea{font-family:var(--sans);font-size:13.5px;background:var(--paper);color:var(--ink);
  border:none;box-shadow:var(--shadow-inset);border-radius:10px;padding:9px 12px;width:100%}
textarea{min-height:90px;resize:vertical;font-family:var(--sans)}
label{display:block;font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.01em;text-transform:none;color:var(--dim);margin:14px 0 5px}
::placeholder{color:#9a9ba0}

/* ---- shell: sidebar + main ---- */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--paper);color:var(--ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside .logo{padding:20px 16px 16px;display:flex;align-items:center;gap:10px}
aside .logo img{flex:none;border-radius:9px}
aside .logo .big{font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.1}
aside .logo .big b{color:var(--orange);font-weight:700}
aside .logo .tag{font-family:var(--sans);font-size:11px;margin-top:3px;color:var(--dim)}
aside nav{padding:6px 12px;display:flex;flex-direction:column;gap:8px}
.nav-group{display:flex;flex-direction:column;gap:3px}
.nav-label{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9a9ba0;padding:8px 12px 2px}
aside nav a{font-family:var(--sans);font-size:13.5px;font-weight:500;letter-spacing:0;text-transform:none;
  color:var(--dim);text-decoration:none;padding:9px 12px;border-radius:10px}
aside nav a:hover{background:rgba(0,0,0,.04);color:var(--ink)}
aside nav a.on{background:var(--paper);color:var(--orange);font-weight:700;box-shadow:var(--shadow-inset)}
aside .who{border-top:var(--bd);padding:14px 16px;margin-top:auto}
aside .who .nm{font-weight:600;font-size:13px;color:var(--ink)}
aside .who .rl{font-family:var(--sans);font-size:11px;color:var(--dim)}
aside .who button{margin-top:10px;width:100%}

.mainwrap{min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:var(--bd);background:var(--paper);position:sticky;top:0;z-index:30}
.topbar h1{font-size:20px;font-weight:700}
.topbar .sub{font-family:var(--mono);font-size:11px;color:var(--dim)}
.topbar .sp{flex:1}
.tb-actions{display:flex;align-items:center;gap:8px}
.tb-actions input[type=search]{width:200px}
.tb-actions:empty{display:none}
.bellwrap{position:relative}
.bell .dot{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:2px solid var(--white);border-radius:99px;font-size:10px;font-weight:700;padding:1px 6px}
.ndrop{position:absolute;top:110%;right:0;width:380px;background:var(--white);border:var(--bd);box-shadow:var(--shadow);z-index:60;display:none;max-height:60vh;overflow-y:auto;border-radius:var(--radius)}
.ndrop.open{display:block}
.ndrop .nitem{padding:10px 14px;border-bottom:1px solid var(--paper2);font-size:12.5px;cursor:pointer}
.ndrop .nitem:hover{background:var(--paper2)}
.ndrop .nitem.unread{border-left:3px solid var(--accent)}
.ndrop .nitem .nt{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:2px}
main{padding:24px 26px 90px}

/* ---- tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.tile{background:var(--white);border:var(--bd);box-shadow:var(--shadow);padding:14px 16px 12px;position:relative;border-radius:var(--radius)}
.tile .n{font-weight:800;font-size:30px;line-height:1}
.tile .t{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--dim);margin-top:6px}
.tile .s{font-family:var(--sans);font-size:11px;color:var(--dim);margin-top:2px}
.tile.warn{background:var(--red-tint)}
.tile.warn .n,.tile.warn .t{color:var(--red)}
.tile.go{background:var(--paper)}
.tile.go .n,.tile.go .t{color:var(--ink)}
.tile.hot{background:var(--orange-tint)}
.tile.hot .n,.tile.hot .t{color:#8a4300}

/* ---- blocks & tables ---- */
.block{background:var(--white);border:var(--bd);box-shadow:var(--shadow);margin-bottom:22px;border-radius:var(--radius);overflow:hidden}
.block .bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:var(--bd);background:var(--paper2)}
.block .bhead h2{font-size:13.5px;font-weight:700;letter-spacing:0;color:var(--ink)}
.block .bhead .note{font-family:var(--sans);font-size:11px;color:var(--dim)}
.block .bpad{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--paper2);font-size:13px}
th{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:none;background:var(--paper2);color:var(--dim)}
td.mono{font-size:11.5px}
.stamp{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;
  border:none;border-radius:6px;padding:3px 9px;background:var(--paper2);color:var(--ink)}
.stamp.High{background:var(--red-tint);color:var(--red)}
.stamp.Medium{background:var(--orange-tint);color:#8a4300}
.stamp.Low{background:var(--paper2);color:var(--dim)}
.stamp.Done{background:var(--ink);color:#fff}
.rlock{font-size:10px;opacity:.6}
.stamp.ToDo{background:var(--paper2);color:var(--dim)}
.stamp.InProgress{background:var(--orange-tint);color:#8a4300}
.stamp.InReview{background:var(--blue-tint);color:#1D5BB8}
.late{color:var(--red);font-family:var(--sans);font-weight:600;font-size:11.5px}
.empty{color:var(--dim);font-family:var(--sans);font-size:13px;padding:22px;text-align:center;text-transform:none;letter-spacing:0}

/* ---- projects grid ---- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{background:var(--white);border:var(--bd);box-shadow:var(--shadow);padding:16px;cursor:pointer;border-radius:var(--radius);transition:box-shadow .12s,transform .12s}
.pcard:hover{box-shadow:0 4px 14px rgba(15,15,15,.08);transform:translateY(-1px)}
.pcard:active{transform:translateY(0) scale(.995)}
.pcard .key{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;background:var(--paper2);color:var(--dim);display:inline-block;padding:2px 8px;border-radius:5px}
.pcard h3{font-size:16px;font-weight:700;margin:8px 0 3px}
.pcard .desc{color:var(--dim);font-size:12.5px;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .foot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ---- kanban ---- */
.board-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.board-head select,.board-head input{width:auto}
.board-head input[type=search]{width:220px}
.fchip{font-family:var(--sans);font-size:12.5px;font-weight:500;padding:6px 12px;border:1px solid var(--line);background:var(--white);cursor:pointer;letter-spacing:0;text-transform:none;box-shadow:none;border-radius:99px}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start}
@media(max-width:1050px){.kanban{grid-template-columns:repeat(2,1fr)}}
.kcol{border:var(--bd);background:var(--paper2);box-shadow:var(--shadow);border-radius:var(--radius);overflow:hidden}
.kcol.dragover{outline:2px dashed var(--accent);outline-offset:-6px}
.kcol .khead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--white);color:var(--ink);border-bottom:var(--bd)}
.kcol .khead h4{font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:0}
.kcol .khead .cnt{font-family:var(--sans);font-size:11px;font-weight:700;background:var(--kc);color:var(--ink);padding:1px 8px;border-radius:99px}
.kcol[data-status="In Progress"] .khead .cnt{color:#fff}
.kcol[data-status="In Review"] .khead .cnt{color:#fff}
.kcol[data-status="Done"] .khead .cnt{color:#fff}
.klist{padding:10px;display:flex;flex-direction:column;gap:10px;min-height:70px}
.card{background:var(--white);border:var(--bd);padding:10px 12px;cursor:grab;box-shadow:var(--shadow-sm);border-radius:6px}
.card:hover{box-shadow:0 3px 10px rgba(15,15,15,.08)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.35}
.card .top{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--dim)}
.card .num{letter-spacing:.03em}
.card .nm{font-size:13.5px;font-weight:600;margin:6px 0 8px;line-height:1.3}
.card .bot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .meta{font-family:var(--sans);font-size:11px;color:var(--dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .who{width:22px;height:22px;border-radius:99px;background:var(--paper2);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:9.5px;font-weight:700}

/* ---- drawer & modal ---- */
.overlay{position:fixed;inset:0;background:rgba(15,15,15,.4);z-index:50;display:none}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:96vw;background:var(--paper);border-left:var(--bd);z-index:51;
  transform:translateX(102%);transition:transform .15s ease;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(15,15,15,.08)}
.drawer.open{transform:none}
.drawer .dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--paper2);color:var(--ink);border-bottom:var(--bd)}
.drawer .dhead .num{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:0;color:var(--dim)}
.drawer .dbody{padding:2px 18px 18px;overflow-y:auto;flex:1;background:var(--paper)}
.drawer .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.drawer .dfoot{padding:12px 18px;border-top:var(--bd);display:flex;gap:10px;justify-content:space-between;background:var(--paper2)}
.drawer .dhead .stamp{border-color:var(--line);color:var(--ink)}
/* drawer section plates */
.dsec{background:var(--white);border:var(--bd);box-shadow:var(--shadow-sm);margin:14px 0;border-radius:var(--radius);overflow:hidden}
.dsec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;
  background:var(--paper2);color:var(--ink);font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:0;text-transform:none}
.dsec-h .sq{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:9px;vertical-align:-1px;background:var(--sc,var(--accent))}
.dtabs{display:flex;gap:6px;padding:10px 18px 0;border-bottom:var(--bd);background:var(--paper2)}
.dtab{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:8px 14px;border:none;background:transparent;box-shadow:none;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;border-radius:0}
.dtab:hover{background:transparent;color:var(--ink)}
.dtab.on{color:var(--ink);border-bottom-color:var(--accent)}
.dpane[hidden],.spane[hidden]{display:none}
.dsec-h .n{color:var(--dim);letter-spacing:0;font-weight:500}
.dsec-b{padding:2px 14px 14px}
.dsec-b>label:first-child,.dsec-b .row2>div>label{margin-top:12px}
.comment{padding:9px 0;border-bottom:1px solid var(--paper2)}
.comment .ch{font-family:var(--sans);font-size:11.5px;color:var(--dim)}
.comment .ch b{color:var(--ink)}
.comment p{font-size:13px;margin-top:2px}
.comment img{max-width:100%;max-height:220px;border:var(--bd);border-radius:6px;margin-top:6px;display:block;cursor:zoom-in}
.pending-img{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:11.5px;background:var(--orange-tint);border-radius:6px;padding:4px 8px;margin-top:8px}
.hist-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--paper2);font-size:12px;align-items:baseline}
.hist-row .ht{font-family:var(--mono);font-size:9.5px;color:var(--dim);min-width:86px}
.hist-row b{font-weight:700}
.hist-row .arrow{font-family:var(--sans);color:var(--dim)}
.file-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--paper2);font-size:12.5px}
.file-row a{color:var(--accent);font-weight:600;text-decoration:none}
.file-row a:hover{text-decoration:underline}
.file-row .fs{font-family:var(--sans);font-size:11px;color:var(--dim)}
.file-row .sp{flex:1}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%);width:500px;max-width:94vw;background:var(--paper);
  border:var(--bd);box-shadow:0 12px 32px rgba(15,15,15,.18);z-index:52;display:none;border-radius:12px;overflow:hidden}
.modal.open{display:block}
.modal .mhead{padding:14px 18px;background:var(--paper2);color:var(--ink);font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:0;text-transform:none;border-bottom:var(--bd)}
.modal .mbody{padding:6px 18px 18px;max-height:70vh;overflow-y:auto}
.modal .mfoot{padding:12px 18px;border-top:var(--bd);display:flex;justify-content:flex-end;gap:10px;background:var(--paper2)}
.formerr{color:var(--red);font-family:var(--sans);font-size:12px;font-weight:600;margin-top:10px;min-height:14px}

/* ---- login ---- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--paper2)}
.login{width:400px;background:var(--white);border:var(--bd);box-shadow:0 12px 32px rgba(15,15,15,.1);padding:30px;border-radius:14px}
.login .big{font-weight:800;font-size:32px;line-height:1.05;text-transform:none;letter-spacing:-.01em}
.login .big b{color:var(--accent);font-weight:800}
.login .tag{font-family:var(--sans);font-size:12px;color:var(--dim);margin:8px 0 4px;text-transform:none;letter-spacing:0}

/* ---- roles ---- */

/* ---- split view: details / board on the left, file manager on the right ---- */
/* files live in a slide-over drawer, so the board keeps its full width */
.drawer.wide{width:70vw;max-width:96vw}
.drawer.wide .dbody{padding:0;display:flex}
/* collapsed handle: a slim tab welded to the right edge */
.fmtab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:40;
  display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;
  padding:15px 7px;border:var(--bd);border-right:none;border-radius:var(--radius) 0 0 var(--radius);
  background:var(--white);box-shadow:-3px 0 12px rgba(15,15,15,.09);color:var(--ink)}
.fmtab:hover{background:var(--paper2)}
.fmtab .lbl{writing-mode:vertical-rl;text-orientation:mixed;font-family:var(--sans);
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.bigpanel{position:fixed;inset:24px;z-index:51;background:var(--paper);border:var(--bd);border-radius:var(--radius);
  box-shadow:0 20px 50px rgba(15,15,15,.22);display:none;flex-direction:column;overflow:hidden}
.bigpanel.open{display:flex}
.bigpanel .bp-head{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--paper2);border-bottom:var(--bd)}
.bigpanel .bp-head h2{font-size:15px;font-weight:700}
.bigpanel .bp-head .num{font-family:var(--mono);font-size:11px;color:var(--dim)}
.bigpanel .bp-body{flex:1;min-height:0;display:grid;grid-template-columns:40% 60%}
.bigpanel .bp-left{overflow-y:auto;padding:4px 18px 18px;border-right:var(--bd)}
.bigpanel .bp-right{min-width:0;display:flex;flex-direction:column;padding:14px}
.bigpanel .bp-foot{padding:12px 18px;border-top:var(--bd);background:var(--paper2);display:flex;justify-content:space-between;gap:10px}

/* ---- file manager ---- */
.fm{display:flex;flex-direction:column;background:var(--white);border:var(--bd);box-shadow:var(--shadow);
  border-radius:var(--radius);overflow:hidden;min-height:340px;flex:1;outline:none}
.fm-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 12px;background:var(--paper2);border-bottom:var(--bd)}
.fm-crumbs{display:flex;align-items:center;gap:4px;flex:1;min-width:130px;font-size:12px;overflow:hidden}
.fm-crumbs a{color:var(--dim);text-decoration:none;font-weight:600;cursor:pointer;white-space:nowrap;padding:2px 5px;border-radius:6px}
.fm-crumbs a:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.fm-crumbs a.here{color:var(--ink)}
.fm-crumbs i{color:var(--dim);font-style:normal}
.fm-tools{display:flex;gap:6px;flex-wrap:wrap}
.fm-tools button{padding:5px 10px;font-size:11.5px;font-weight:600;box-shadow:none;border:1px solid var(--line);background:var(--white);border-radius:8px}
.fm-tools button:hover:not(:disabled){background:var(--paper2);box-shadow:none}
.fm-tools button:disabled{opacity:.38;cursor:default}
.fm-body{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
  gap:10px;align-content:start;min-height:180px}
.fm-body.dropping{background:var(--orange-tint)}
.fm-item{border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center;cursor:pointer;
  background:var(--paper);user-select:none;overflow:hidden}
.fm-item:hover{background:var(--paper2)}
.fm-item.sel{background:var(--orange-tint);border-color:var(--orange)}
.fm-item.cut{opacity:.45}
.fm-item.dragover{outline:2px dashed var(--accent);outline-offset:-3px}
.fm-item .ic{font-size:26px;line-height:1.1}
.fm-item .nm{font-size:11.5px;font-weight:600;margin-top:6px;word-break:break-word;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fm-item .sz{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:3px}
.fm-item input{font-size:11.5px;padding:3px 6px;text-align:center;border-radius:6px}
.fm-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-top:var(--bd);
  background:var(--paper2);font-size:11px;color:var(--dim)}
.fm-foot .keys{margin-left:auto;font-family:var(--mono);font-size:9.5px}
.fm-foot .clip{font-weight:700;color:var(--accent)}
.fm-empty{grid-column:1/-1;color:var(--dim);font-size:13px;padding:26px;text-align:center}

/* ---- mobile ---- */
.menu-btn{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:260px;max-width:82vw;height:100dvh;z-index:80;
    transform:translateX(-103%);transition:transform .16s ease;box-shadow:4px 0 20px rgba(15,15,15,.2)}
  aside.open{transform:none}
  .menu-btn{display:inline-block}
  .topbar{padding:12px 14px;gap:10px;flex-wrap:wrap}
  .bellwrap{order:1}
  .tb-actions{order:2;flex:1 1 100%;flex-wrap:wrap}
  .tb-actions input[type=search]{width:100%}
  .topbar h1{font-size:17px}
  .topbar .sub{display:none}
  main{padding:16px 14px 70px}
  .ndrop{position:fixed;top:64px;left:10px;right:10px;width:auto}
  .drawer{width:100vw;max-width:100vw}
  .drawer .row2{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr);gap:10px}
  .tile .n{font-size:26px}
  .board-head input[type=search]{width:100%;order:9}

  /* compact 3-up card grid on mobile */
  .pgrid{grid-template-columns:repeat(3,1fr);gap:8px}
  .pcard{padding:8px;border-radius:10px}
  .pcard .key{font-size:8px;padding:1px 4px;letter-spacing:0}
  .pcard h3{font-size:11px;margin:5px 0 2px;line-height:1.15}
  .pcard .desc{display:none}
  .pcard .foot{margin-top:6px;gap:4px}
  .pcard .foot .stamp{font-size:7.5px;padding:1px 4px}
  .pcard .foot .who{width:16px;height:16px;font-size:7px}

  .drawer.wide{width:96vw}
  .fmtab{top:auto;bottom:78px;transform:none}
  .bigpanel{inset:0;border-radius:0}
  .bigpanel .bp-body{grid-template-columns:1fr;overflow-y:auto}
  .bigpanel .bp-left{border-right:none;border-bottom:var(--bd)}
  .bigpanel .bp-right{min-height:60vh}
  .fm-body{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}

  /* compact table: shrink until every header fits, no horizontal scroll */
  .tbl-compact{table-layout:fixed;width:100%}
  .tbl-compact th,.tbl-compact td{padding:4px 3px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbl-compact .stamp{padding:1px 4px;font-size:7.5px}
  .tbl-compact .mono{font-size:8px}
  .tbl-compact th{font-size:8px;letter-spacing:0}
}
/* kanban status tabs — mobile shows one column at a time */
.ktabs{display:none}
@media(max-width:700px){
  .ktabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
  .ktabs .fchip{white-space:nowrap}
  .ktabs .fchip .kn{display:inline-block;min-width:16px;text-align:center;background:var(--orange-tint);color:var(--ink);margin-left:6px;padding:0 3px;border-radius:4px}
  .ktabs .fchip.on .kn{background:#fff;color:var(--ink)}
  .kanban{display:block}
  .kanban .kcol{display:none}
  .kanban .kcol.active{display:block}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUSES=["To Do","In Progress","In Review","Done"];
const KC={"To Do":"#E2E4E8","In Progress":"#FF7A00","In Review":"#2F80ED",Done:"#1A1A1A"};
const fmtD=(d)=>d?new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"";
const fmtSize=(b)=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const initials=(n)=>String(n||"?").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const stampCls=(v)=>String(v||"").replace(/\s/g,"");
const stampLabel=(v)=>v==="Done"?"✓ Done":esc(v);
const isPast=(d)=>d&&new Date(d)<new Date(new Date().toDateString());

let ME=null, USERS=[], PROJECTS=[], TASKS=[], NOTIFS=[], BOARD_STORIES=[], BOARD_CRIT=new Map(), RBAC={}, CUSTOMERS=[];
let FILTER={assignee:"",q:""};
// role ladder — the four built-in rungs plus any custom role, which inherits
// the rank of the rung it's based on. Filled from /api/roles at boot.
const BUILTIN_ROLES=["TEAMMATE","LEAD","ADMIN","SUPERADMIN"];
let ROLE_DEFS=[], ROLES=[...BUILTIN_ROLES],
    ROLE_LABEL={TEAMMATE:"Teammate",LEAD:"Lead",ADMIN:"Admin",SUPERADMIN:"Superadmin"},
    RANK=Object.fromEntries(BUILTIN_ROLES.map((r,i)=>[r,i+1]));
function applyRoles(defs){
  if(!defs?.length) return;
  ROLE_DEFS=defs;
  ROLES=defs.map(d=>d.role);
  ROLE_LABEL=Object.fromEntries(defs.map(d=>[d.role,d.label]));
  RANK=Object.fromEntries(defs.map(d=>[d.role,d.rank]));
}
const can=(role)=>!!ME&&(RANK[ME.role]||0)>=RANK[role];
// true when the signed-in user outranks (or equals) this role, so may edit it
const myRole=(role)=>(RANK[ME?.role]||0)>=(RANK[role]||0);
const isLead=()=>can("LEAD");
const canSeePage=(page)=>ME&&(can("SUPERADMIN")||(RBAC[page]||[]).includes(ME.role));

async function api(path,opts={}){
  const res=await fetch(path,{...opts,headers:{...(opts.body?{"Content-Type":"application/json"}:{}),...(opts.headers||{})}});
  if(res.status===401&&!path.includes("/auth/")){ME=null;render();throw new Error("Session expired — sign in again");}
  const body=await res.json().catch(()=>null);
  if(!res.ok) throw new Error(body?.error||("HTTP "+res.status));
  return body;
}

function route(){
  const h=location.hash||"#/dashboard";
  const m=/^#\/board\/(\d+)/.exec(h);
  if(m) return {view:"board",projectId:Number(m[1])};
  const rt=/^#\/reset\/([\w-]+)/.exec(h);
  if(rt) return {view:"reset",token:rt[1]};
  if(h.startsWith("#/tasks")) return {view:"tasks"};
  if(h.startsWith("#/clients")||h.startsWith("#/projects")||h.startsWith("#/products")) return {view:"clients"};
  if(h.startsWith("#/internal")) return {view:"internal"};
  if(h.startsWith("#/customers")) return {view:"customers"};
  if(h.startsWith("#/command")) return {view:"command"};
  if(h.startsWith("#/team")) return {view:"team"};
  if(h.startsWith("#/pages")||h.startsWith("#/access")) return {view:"pages"};
  if(h.startsWith("#/roles")) return {view:"roles"};
  return {view:"dashboard"};
}
window.addEventListener("hashchange",()=>{closePanels();render();});

// ---------- boot ----------
async function boot(){
  const st=await api("/api/auth/status");
  if(!st.authenticated){ME=null;render();return;}
  const users=await api("/api/users");
  ME=users.find(u=>u.username===st.username);
  USERS=users.filter(u=>u.enabled);
  let roleDefs;
  [PROJECTS,RBAC,CUSTOMERS,roleDefs]=await Promise.all([api("/api/projects"),api("/api/rbac").catch(()=>({})),api("/api/customers").catch(()=>[]),api("/api/roles").catch(()=>[])]);
  applyRoles(roleDefs); // before anything renders — nav and gating depend on it
  await refreshNotifs();
  render();
}
async function refreshNotifs(){
  if(!ME?.id) return;
  try{NOTIFS=await api("/api/notifications/user/"+ME.id);}catch{}
  const b=$("#nBadge"); if(b){const u=NOTIFS.filter(n=>!n.read).length; b.outerHTML=badgeHtml(u);}
}
setInterval(refreshNotifs,45_000);
const badgeHtml=(u)=>u?`<span class="dot" id="nBadge">${u}</span>`:`<span id="nBadge"></span>`;

// ---------- render shell ----------
function render(){
  const app=$("#app");
  const r0=route();
  if(r0.view==="reset"){app.innerHTML=resetView(r0.token);return;}
  if(!ME){app.innerHTML=loginView();return;}
  const r=r0;
  const unread=NOTIFS.filter(n=>!n.read).length;
  const boardProject=r.view==="board"?PROJECTS.find(p=>p.id===r.projectId):null;
  const titles={dashboard:"My Dashboard",tasks:can("LEAD")?"All Tasks":"My Tasks",command:"Admin Dashboard",clients:"Client Projects",internal:"Internal Projects",customers:"Customers",team:"User Management",roles:"Roles",pages:"Page Permission",board:boardProject?.name||"Board"};
  app.innerHTML=`
  <div class="shell">
    <aside>
      <div class="logo"><img src="/logo.svg" alt="Trivyah" width="34" height="34">
        <div><div class="big">Trivyah</div><div class="tag">Task Manager</div></div></div>
      <nav>${[
        {label:"Work",links:[
          canSeePage("dashboard")&&{view:"dashboard",href:"#/dashboard",text:"Dashboard"},
          canSeePage("tasks")&&{view:"tasks",href:"#/tasks",text:can("LEAD")?"All Tasks":"My Tasks"},
          canSeePage("command")&&{view:"command",href:"#/command",text:"Admin Dashboard"},
        ]},
        {label:"Services",links:[
          canSeePage("clients")&&{view:"clients",href:"#/clients",text:"Client Projects"},
          canSeePage("internal")&&{view:"internal",href:"#/internal",text:"Internal Projects"},
          canSeePage("customers")&&{view:"customers",href:"#/customers",text:"Customers"},
        ]},
        {label:"Admin",links:[
          canSeePage("team")&&{view:"team",href:"#/team",text:"User Management"},
          can("ADMIN")&&{view:"roles",href:"#/roles",text:"Roles"},
          can("ADMIN")&&{view:"pages",href:"#/pages",text:"Page Permission"},
        ]},
      ].map(g=>{
        const links=g.links.filter(Boolean);
        if(!links.length)return"";
        return `<div class="nav-group"><div class="nav-label">${g.label}</div>
          ${links.map(l=>`<a href="${l.href}" class="${r.view===l.view?"on":""}">${l.text}</a>`).join("")}</div>`;
      }).join("")}</nav>
      <div class="who"><div class="nm">${esc(ME.displayName)}</div><div class="rl">${esc(ROLE_LABEL[ME.role]||ME.role)}</div>
        <button data-act="logout">Log out</button></div>
    </aside>
    <div class="mainwrap">
      <div class="topbar"><button class="bare menu-btn" data-act="menu" aria-label="Menu">☰</button><h1>${esc(titles[r.view])}</h1>
        <span class="sub">${r.view==="board"?esc(PROJECTS.find(p=>p.id===r.projectId)?.key||""):""}</span>
        <span class="sp"></span>
        <div class="tb-actions" id="tbActions"></div>
        <div class="bellwrap"><button class="bare" data-act="bell">▤ Inbox${badgeHtml(unread)}</button>
          <div class="ndrop" id="ndrop">${NOTIFS.length?NOTIFS.map(n=>`
            <div class="nitem ${n.read?"":"unread"}" data-act="notif" data-task="${n.taskId||""}">${esc(n.text)}
            <div class="nt">${fmtD(n.createdDate)}</div></div>`).join("")
            :'<div class="empty">Inbox zero</div>'}</div></div>
      </div>
      <main id="main"></main>
    </div>
  </div>
  <div class="overlay" id="overlay" data-act="close"></div>
  <div class="drawer" id="drawer"></div>
  <div class="drawer wide" id="fmdrawer"></div>
  <div class="modal" id="modal"></div>
  <div class="bigpanel" id="bigpanel"></div>`;
  if(r.view!=="board"&&r.view!=="roles"&&r.view!=="pages"&&!canSeePage(r.view)){location.hash="#/dashboard";return;}
  if(r.view==="dashboard") renderDashboard();
  else if(r.view==="tasks") renderTasks();
  else if(r.view==="command") renderCommand();
  else if(r.view==="clients") renderProjects();
  else if(r.view==="internal") renderInternal();
  else if(r.view==="customers") renderCustomers();
  else if(r.view==="team") renderTeam();
  else if(r.view==="pages"){if(!can("ADMIN")){location.hash="#/dashboard";return;}renderPages();}
  else if(r.view==="roles"){if(!can("ADMIN")){location.hash="#/dashboard";return;}renderRoleDefs();}
  else renderBoard(r.projectId);
}
function closePanels(){$("#overlay")?.classList.remove("open");$("#drawer")?.classList.remove("open");$("#fmdrawer")?.classList.remove("open");$("#modal")?.classList.remove("open");$("#bigpanel")?.classList.remove("open");$("aside")?.classList.remove("open");}

// ---------- global event delegation (robust: no per-node handlers) ----------
document.addEventListener("click",async(e)=>{
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const act=el.dataset.act;
  if(act==="menu"){$("aside").classList.toggle("open");$("#overlay").classList.toggle("open",$("aside").classList.contains("open"));}
  else if(act==="logout"){await api("/api/auth/logout",{method:"POST"});ME=null;render();}
  else if(act==="bell"){
    $("#ndrop").classList.toggle("open");
    const unread=NOTIFS.filter(n=>!n.read);
    for(const n of unread) api(`/api/notifications/${n.id}/read`,{method:"PUT"}).catch(()=>{});
    NOTIFS=NOTIFS.map(n=>({...n,read:1}));
    const b=$("#nBadge"); if(b) b.outerHTML=badgeHtml(0);
  }
  else if(act==="notif"&&el.dataset.task){
    try{const s=await api("/api/tasks/"+el.dataset.task);
      $("#ndrop").classList.remove("open");
      location.hash="#/board/"+s.project.id;
      setTimeout(()=>taskDrawer(s,s.project.id),150);
    }catch{}
  }
  else if(act==="close") closePanels();
  else if(act==="del-project"){
    if(!confirm(`Delete project "${el.dataset.name}" AND all its tasks, comments and files? This cannot be undone.`))return;
    try{await api("/api/projects/"+el.dataset.id,{method:"DELETE"});
      PROJECTS=await api("/api/projects");render();}
    catch(err){alert(err.message);}
  }
  else if(act==="open-project"){closePanels();location.hash="#/board/"+el.dataset.id;}
  else if(act==="new-project") projectModal(el.dataset.cat||"client");
  else if(act==="new-customer") customerModal(null);
  else if(act==="open-task-filter") taskFilterDrawer();
  else if(act==="project-settings") projectSettingsModal(PROJECTS.find(p=>p.id===Number(el.dataset.id)));
  else if(act==="new-user") userModal();
  else if(act==="new-task") taskDrawer(null,Number(el.dataset.project));
  else if(act==="open-task"){
    const s=BOARD_STORIES.find(x=>x.id===Number(el.dataset.id))||TASKS.find(x=>x.id===Number(el.dataset.id));
    if(s) taskDrawer(s,s.project?.id||s.projectId);
  }
});
document.addEventListener("keydown",(e)=>{if(e.key==="Escape")closePanels();});

// ---------- login ----------
function loginView(){setTimeout(()=>{
  $("#loginForm").onsubmit=async(e)=>{e.preventDefault();
    try{await api("/api/auth/login",{method:"POST",body:JSON.stringify({username:$("#lu").value,password:$("#lp").value})});boot();}
    catch(err){$("#lerr").textContent=/401|credential/i.test(err.message)?"WRONG USERNAME OR PASSWORD":err.message;}};
  $("#forgot").onclick=async(e)=>{e.preventDefault();
    const uname=$("#lu").value.trim()||prompt("Your username or email:");
    if(!uname)return;
    await api("/api/auth/forgot",{method:"POST",body:JSON.stringify({username:uname})}).catch(()=>{});
    alert("If that account has an email on file, a reset link was sent. Otherwise ask your admin for a reset link.");};
},0);
return `<div class="login-wrap"><form class="login" id="loginForm">
  <div class="big">Trivyah Task Manager</div><div class="tag">Projects · Tasks · Board</div>
  <label>Username</label><input id="lu" autocomplete="username" required>
  <label>Password</label><input id="lp" type="password" autocomplete="current-password" required>
  <div class="formerr" id="lerr"></div>
  <button class="primary" style="width:100%;margin-top:8px">Sign in →</button>
  <div style="margin-top:14px;text-align:center"><a href="#" id="forgot" style="font-family:var(--mono);font-size:11px;color:var(--dim)">Forgot password?</a></div>
</form></div>`;}

function resetView(token){setTimeout(()=>{
  $("#resetForm").onsubmit=async(e)=>{e.preventDefault();
    if($("#rp1").value!==$("#rp2").value){$("#rerr").textContent="PASSWORDS DON'T MATCH";return;}
    try{
      await api("/api/auth/reset",{method:"POST",body:JSON.stringify({token,password:$("#rp1").value})});
      alert("Password set — sign in with it now.");
      location.hash="";location.reload();
    }catch(err){$("#rerr").textContent=err.message;}};
},0);
return `<div class="login-wrap"><form class="login" id="resetForm">
  <div class="big">Trivyah Task Manager</div><div class="tag">Set a new password</div>
  <label>New password</label><input id="rp1" type="password" autocomplete="new-password" required>
  <label>Repeat it</label><input id="rp2" type="password" autocomplete="new-password" required>
  <div class="formerr" id="rerr"></div>
  <button class="primary" style="width:100%;margin-top:8px">Set password →</button>
</form></div>`;}

// ---------- dashboard ----------
let ANALYTICS=null;
const tiles=(arr)=>arr.map(([n,t,s,cls])=>`<div class="tile ${cls||""}"><div class="n">${n}</div><div class="t">${t}</div><div class="s">${s||""}</div></div>`).join("");

async function renderDashboard(){
  TASKS=await api("/api/tasks"); // server-side scoped to my visibility
  const open=TASKS.filter(s=>s.status!=="Done");
  const mine=open.filter(s=>s.assignedTo?.id===ME.id);
  const week=new Date(Date.now()+7*86400e3).toISOString().slice(0,10);
  let html="";
  // personal section (everyone)
  const myOver=mine.filter(s=>isPast(s.dueDate));
  const dueSoon=mine.filter(s=>s.dueDate&&!isPast(s.dueDate)&&s.dueDate<=week);
  html+=`<div class="tiles">${tiles([
    [mine.length,"My open items","assigned to me"],
    [dueSoon.length,"Due this week",""],
    [myOver.length,"My overdue","",myOver.length?"warn":"go"],
    [TASKS.filter(s=>s.assignedTo?.id===ME.id&&s.status==="Done").length,"Done total","all time"],
  ])}</div>
  <div class="block"><div class="bhead"><h2>My queue</h2><div class="note">everything assigned to me, urgent first</div></div>
    ${mine.length?`<table class="tbl-compact"><thead><tr><th>Task</th><th>Project</th><th>Status</th><th>Priority</th><th>Due</th></tr></thead><tbody>
    ${mine.sort((a,b)=>String(a.dueDate||"9999").localeCompare(String(b.dueDate||"9999")))
      .map(s=>`<tr data-act="open-task" data-id="${s.id}" style="cursor:pointer">
      <td><span class="mono" style="font-size:11px">${esc(s.number)}</span> ${esc(s.name)}</td>
      <td class="mono" data-l="Project">${esc(s.project?.key||"")}</td>
      <td data-l="Status"><span class="stamp ${stampCls(s.status)}">${stampLabel(s.status)}</span></td>
      <td data-l="Priority"><span class="stamp ${stampCls(s.priority)}">${esc(s.priority)}</span></td>
      <td data-l="Due">${s.dueDate?(isPast(s.dueDate)?`<span class="late">${fmtD(s.dueDate)} ⚑</span>`:fmtD(s.dueDate)):"—"}</td></tr>`).join("")}</tbody></table>`
    :'<div class="empty">Nothing assigned to you. Enjoy it while it lasts.</div>'}</div>`;
  $("#main").innerHTML=html;
}

// ---------- all tasks (filter by client / project / dev-devlead) ----------
let TASK_FILTER={customer:"",project:"",assignee:"",status:"",q:""};
let TASK_PAGE=1;
const TASK_PAGE_SIZE=25;
const taskFilterCount=()=>Object.values(TASK_FILTER).filter(Boolean).length;
function taskFilterDrawer(){
  const customersInUse=CUSTOMERS.filter(c=>PROJECTS.some(p=>p.customerId===c.id));
  const d=$("#drawer");
  d.innerHTML=`

        ${USERS.map(u=>`<option value="${u.id}" ${String(TASK_FILTER.assignee)===String(u.id)?"selected":""}>${esc(u.displayName)}</option>`).join("")}</select>`:""}

let paintTasks=()=>{};
async function renderTasks(){
  TASKS=await api("/api/tasks"); // server-side scoped to my visibility
  // teammates get their own queue here, not the whole project's list
  if(!can("LEAD")) TASKS=TASKS.filter(s=>s.assignedTo?.id===ME.id);
  $("#tbActions").innerHTML=`<input type="search" id="tfQuickQ" placeholder="Search tasks…" value="${esc(TASK_FILTER.q)}">
    <button id="tfOpenBtn" data-act="open-task-filter">${taskFilterCount()?`Filter (${taskFilterCount()})`:"Filter"}</button>`;
  $("#tfQuickQ").oninput=(e)=>{TASK_FILTER.q=e.target.value;TASK_PAGE=1;paintTasks();};
  $("#main").innerHTML=`<div class="block"><div class="bhead"><h2>${can("LEAD")?"Tasks":"My Tasks"}</h2><div class="note" id="tfCount"></div></div>
    <div id="tfBody"></div>
    <div id="tfPager" style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:var(--bd)"></div></div>`;
  paintTasks=()=>{
    const vis=TASKS.filter(s=>
      (!TASK_FILTER.customer||String(s.project?.customerId)===String(TASK_FILTER.customer))&&
      (!TASK_FILTER.project||String(s.project?.id)===String(TASK_FILTER.project))&&
      (!TASK_FILTER.assignee||String(s.assignedTo?.id)===String(TASK_FILTER.assignee))&&
      (!TASK_FILTER.status||s.status===TASK_FILTER.status)&&
      (!TASK_FILTER.q||(s.name+" "+s.number+" "+(s.tag||"")).toLowerCase().includes(TASK_FILTER.q.toLowerCase())))
      .sort((a,b)=>String(a.dueDate||"9999").localeCompare(String(b.dueDate||"9999")));
    $("#tfCount").textContent=`${vis.length} item${vis.length===1?"":"s"}`;
    const pages=Math.max(1,Math.ceil(vis.length/TASK_PAGE_SIZE));
    if(TASK_PAGE>pages)TASK_PAGE=pages;
    const page=vis.slice((TASK_PAGE-1)*TASK_PAGE_SIZE,TASK_PAGE*TASK_PAGE_SIZE);
    $("#tfBody").innerHTML=page.length?`<div style="overflow-x:auto"><table class="tbl-compact"><thead><tr><th>Task</th><th>Project</th><th>Customer</th><th>Assignee</th><th>Status</th><th>Priority</th><th>Due</th></tr></thead><tbody>
      ${page.map(s=>`<tr data-act="open-task" data-id="${s.id}" style="cursor:pointer">
        <td><span class="mono" style="font-size:11px">${esc(s.number)}</span> ${esc(s.name)}</td>
        <td class="mono">${esc(s.project?.key||"")}</td>
        <td>${s.project?.customer?esc(s.project.customer.name)+` <span class="mono" style="font-size:10px;color:var(--dim)">${esc(s.project.customer.customerNumber)}</span>`:"—"}</td>
        <td>${esc(s.assignedTo?.displayName||"—")}</td>
        <td><span class="stamp ${stampCls(s.status)}">${stampLabel(s.status)}</span></td>
        <td><span class="stamp ${stampCls(s.priority)}">${esc(s.priority)}</span></td>
        <td>${s.dueDate?(isPast(s.dueDate)&&s.status!=="Done"?`<span class="late">${fmtD(s.dueDate)} ⚑</span>`:fmtD(s.dueDate)):"—"}</td></tr>`).join("")}</tbody></table></div>`
      :'<div class="empty">No tasks match these filters</div>';
    $("#tfPager").innerHTML=vis.length?`
      <span style="font-family:var(--sans);font-size:12px;color:var(--dim)">Page ${TASK_PAGE} of ${pages}</span>
      <div style="display:flex;gap:8px">
        <button class="bare" id="tfPrev" ${TASK_PAGE<=1?"disabled":""}>‹ Prev</button>
        <button class="bare" id="tfNext" ${TASK_PAGE>=pages?"disabled":""}>Next ›</button>
      </div>`:"";
    $("#tfPrev")?.addEventListener("click",()=>{TASK_PAGE--;paintTasks();});
    $("#tfNext")?.addEventListener("click",()=>{TASK_PAGE++;paintTasks();});
  };
  paintTasks();
}

// ---------- file manager ----------
// One reusable folder/file browser, mounted wherever a scope needs it: every
// customer and every project has its own tree. Keyboard shortcuts mirror a
// desktop file explorer — Ctrl+C / Ctrl+X / Ctrl+V / F2 / Delete.
const FM_ICON=(n)=>n.type==="folder"?"📁"
  :/^image\//.test(n.mime||"")?"🖼"
  :/^video\//.test(n.mime||"")?"🎬"
  :/^audio\//.test(n.mime||"")?"🎵"
  :/pdf/.test(n.mime||"")?"📕"
  :/zip|compress|tar|rar/.test(n.mime||"")?"🗜"
  :/sheet|excel|csv/.test(n.mime||"")?"📊"
  :"📄";
let FM_CLIP=null; // {mode:"copy"|"cut", ids:[], scopeType, scopeId} — shared across managers

function fileManager(host,scopeType,scopeId,opts={}){
  const canWrite=opts.canWrite!==false;
  let parentId=null, crumbs=[], nodes=[], sel=new Set(), renaming=null, busy=false;

  host.innerHTML=`<div class="fm" tabindex="0">
    <div class="fm-head">
      <div class="fm-crumbs"></div>
      <div class="fm-tools">
        ${canWrite?`<button data-fma="newfolder">+ Folder</button><button data-fma="upload">↑ Upload</button>`:""}
        <button data-fma="open" disabled>Open</button>
        ${canWrite?`<button data-fma="rename" disabled>Rename</button>
        <button data-fma="copy" disabled>Copy</button>
        <button data-fma="cut" disabled>Cut</button>
        <button data-fma="paste" disabled>Paste</button>
        <button data-fma="del" disabled>Delete</button>`:""}
      </div>
    </div>
    <div class="fm-body"></div>
    <div class="fm-foot"><span class="count"></span><span class="clip"></span>
      <span class="keys">Ctrl+C copy · Ctrl+X cut · Ctrl+V paste · F2 rename · Del delete</span></div>
    <input type="file" multiple style="display:none">
  </div>`;
  const root=$(".fm",host), body=$(".fm-body",host), picker=$("input[type=file]",host);
  const tool=(a)=>$(`[data-fma="${a}"]`,host);

  const setBusy=(b)=>{busy=b;root.style.opacity=b?".6":"";};
  const load=async(pid=parentId)=>{
    setBusy(true);
    try{
      const q=`scopeType=${scopeType}&scopeId=${scopeId}`+(pid?`&parentId=${pid}`:"");
      const r=await api("/api/fs?"+q);
      parentId=pid;crumbs=r.breadcrumb;nodes=r.nodes;sel=new Set();renaming=null;
      paint();
    }catch(e){body.innerHTML=`<div class="fm-empty">${esc(e.message)}</div>`;}
    setBusy(false);
  };

  const paint=()=>{
    $(".fm-crumbs",host).innerHTML=[`<a data-crumb="">Files</a>`]
      .concat(crumbs.map((c,i)=>`<i>›</i><a data-crumb="${c.id}" class="${i===crumbs.length-1?"here":""}">${esc(c.name)}</a>`)).join("");
    body.innerHTML=nodes.length?nodes.map(n=>{
      const cut=FM_CLIP?.mode==="cut"&&FM_CLIP.ids.includes(n.id);
      return `<div class="fm-item ${sel.has(n.id)?"sel":""} ${cut?"cut":""}" data-id="${n.id}" data-type="${n.type}"
        draggable="${canWrite}" title="${esc(n.name)}">
        <div class="ic">${FM_ICON(n)}</div>
        ${renaming===n.id?`<input class="rn" value="${esc(n.name)}">`:`<div class="nm">${esc(n.name)}</div>`}
        <div class="sz">${n.type==="folder"?"folder":fmtSize(n.size)}</div>
      </div>`;}).join("")
      :`<div class="fm-empty">This folder is empty${canWrite?" — create a folder or drop files here":""}</div>`;
    const folders=nodes.filter(n=>n.type==="folder").length;
    $(".count",host).textContent=`${folders} folder${folders===1?"":"s"} · ${nodes.length-folders} file${nodes.length-folders===1?"":"s"}`;
    $(".clip",host).textContent=FM_CLIP?`${FM_CLIP.ids.length} item${FM_CLIP.ids.length===1?"":"s"} ${FM_CLIP.mode==="cut"?"cut":"copied"}`:"";
    const one=sel.size===1, any=sel.size>0;
    if(tool("open"))tool("open").disabled=!one;
    if(tool("rename"))tool("rename").disabled=!one;
    if(tool("copy"))tool("copy").disabled=!any;
    if(tool("cut"))tool("cut").disabled=!any;
    if(tool("del"))tool("del").disabled=!any;
    if(tool("paste"))tool("paste").disabled=!FM_CLIP||FM_CLIP.scopeType!==scopeType||String(FM_CLIP.scopeId)!==String(scopeId);
    const rn=$(".rn",host);
    if(rn){rn.focus();rn.select();
      rn.onkeydown=(e)=>{e.stopPropagation();
        if(e.key==="Enter")commitRename(rn.value);
        else if(e.key==="Escape"){renaming=null;paint();}};
      rn.onblur=()=>commitRename(rn.value);}
  };

  const commitRename=async(name)=>{
    const id=renaming; renaming=null;
    const n=nodes.find(x=>x.id===id);
    if(!n||!name.trim()||name===n.name){paint();return;}
    try{await api("/api/fs/"+id,{method:"PUT",body:JSON.stringify({name})});}catch(e){alert(e.message);}
    load();
  };
  const open=(n)=>{
    if(!n)return;
    if(n.type==="folder")load(n.id);
    else window.open(n.url,"_blank","noopener");
  };
  const uploadFiles=async(files)=>{
    for(const f of files){
      if(f.size>25*1024*1024){alert(`${f.name} is over 25 MB`);continue;}
      const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(f);});
      try{await api("/api/fs/upload",{method:"POST",body:JSON.stringify({scopeType,scopeId,parentId,filename:f.name,mime:f.type,dataBase64:b64})});}
      catch(e){alert(e.message);}
    }
    load();
  };
  const paste=async()=>{
    if(!FM_CLIP)return;
    setBusy(true);
    for(const id of FM_CLIP.ids){
      try{
        if(FM_CLIP.mode==="copy") await api(`/api/fs/${id}/copy`,{method:"POST",body:JSON.stringify({parentId})});
        else await api("/api/fs/"+id,{method:"PUT",body:JSON.stringify({parentId})});
      }catch(e){alert(e.message);}
    }
    if(FM_CLIP.mode==="cut")FM_CLIP=null;
    load();
  };
  const remove=async()=>{
    const picked=nodes.filter(n=>sel.has(n.id));
    if(!picked.length)return;
    const folders=picked.filter(n=>n.type==="folder").length;
    if(!confirm(`Delete ${picked.length} item${picked.length===1?"":"s"}?${folders?" Folders are deleted with everything inside them.":""}`))return;
    setBusy(true);
    for(const n of picked){try{await api("/api/fs/"+n.id,{method:"DELETE"});}catch(e){alert(e.message);}}
    load();
  };
  const clip=(mode)=>{if(!sel.size)return;FM_CLIP={mode,ids:[...sel],scopeType,scopeId};paint();};

  // --- interaction
  host.addEventListener("click",(e)=>{
    const crumb=e.target.closest("[data-crumb]");
    if(crumb){load(crumb.dataset.crumb?Number(crumb.dataset.crumb):null);return;}
    const btn=e.target.closest("[data-fma]");
    if(btn){
      root.focus();
      const a=btn.dataset.fma;
      if(a==="newfolder"){const name=prompt("Folder name","New folder");if(name!==null)
        api("/api/fs/folder",{method:"POST",body:JSON.stringify({scopeType,scopeId,parentId,name})}).then(()=>load()).catch(er=>alert(er.message));}
      else if(a==="upload")picker.click();
      else if(a==="open")open(nodes.find(n=>sel.has(n.id)));
      else if(a==="rename"){renaming=[...sel][0];paint();}
      else if(a==="copy")clip("copy");
      else if(a==="cut")clip("cut");
      else if(a==="paste")paste();
      else if(a==="del")remove();
      return;
    }
    const item=e.target.closest(".fm-item");
    root.focus();
    if(!item){if(!renaming){sel=new Set();paint();}return;}
    if(renaming===Number(item.dataset.id))return;
    const id=Number(item.dataset.id);
    if(e.ctrlKey||e.metaKey){sel.has(id)?sel.delete(id):sel.add(id);}
    else sel=new Set([id]);
    paint();
  });
  host.addEventListener("dblclick",(e)=>{
    const item=e.target.closest(".fm-item");
    if(item)open(nodes.find(n=>n.id===Number(item.dataset.id)));
  });
  picker.onchange=()=>{if(picker.files.length)uploadFiles([...picker.files]);picker.value="";};

  root.addEventListener("keydown",(e)=>{
    if(busy||renaming)return;
    const ctrl=e.ctrlKey||e.metaKey;
    if(ctrl&&e.key.toLowerCase()==="c"){e.preventDefault();clip("copy");}
    else if(ctrl&&e.key.toLowerCase()==="x"){e.preventDefault();clip("cut");}
    else if(ctrl&&e.key.toLowerCase()==="v"){e.preventDefault();if(canWrite)paste();}
    else if(ctrl&&e.key.toLowerCase()==="a"){e.preventDefault();sel=new Set(nodes.map(n=>n.id));paint();}
    else if(e.key==="F2"&&sel.size===1&&canWrite){e.preventDefault();renaming=[...sel][0];paint();}
    else if((e.key==="Delete"||e.key==="Backspace")&&sel.size&&canWrite){e.preventDefault();remove();}
    else if(e.key==="Enter"&&sel.size===1){e.preventDefault();open(nodes.find(n=>sel.has(n.id)));}
    else if(e.key==="Backspace"&&!sel.size&&crumbs.length){e.preventDefault();load(crumbs.length>1?crumbs[crumbs.length-2].id:null);}
    else if(e.key==="Escape"&&(sel.size||FM_CLIP)){e.stopPropagation();sel=new Set();FM_CLIP=null;paint();}
  });

  if(canWrite){
    // drag a node onto a folder to move it; drop OS files anywhere to upload
    host.addEventListener("dragstart",(e)=>{
      const item=e.target.closest(".fm-item");
      if(!item)return;
      const id=Number(item.dataset.id);
      if(!sel.has(id)){sel=new Set([id]);paint();}
      e.dataTransfer.setData("text/plain","fsnode:"+[...sel].join(","));
    });
    host.addEventListener("dragover",(e)=>{
      e.preventDefault();
      const folder=e.target.closest('.fm-item[data-type="folder"]');
      $$(".fm-item.dragover",host).forEach(x=>x.classList.remove("dragover"));
      if(folder)folder.classList.add("dragover");else body.classList.add("dropping");
    });
    host.addEventListener("dragleave",(e)=>{if(!host.contains(e.relatedTarget)){body.classList.remove("dropping");$$(".fm-item.dragover",host).forEach(x=>x.classList.remove("dragover"));}});
    host.addEventListener("drop",async(e)=>{
      e.preventDefault();
      body.classList.remove("dropping");
      const folder=e.target.closest('.fm-item[data-type="folder"]');
      $$(".fm-item.dragover",host).forEach(x=>x.classList.remove("dragover"));
      const data=e.dataTransfer.getData("text/plain");
      if(data.startsWith("fsnode:")){
        const target=folder?Number(folder.dataset.id):parentId;
        const ids=data.slice(7).split(",").map(Number).filter(id=>id!==target);
        setBusy(true);
        for(const id of ids){try{await api("/api/fs/"+id,{method:"PUT",body:JSON.stringify({parentId:target})});}catch(er){alert(er.message);}}
        load();
        return;
      }
      if(e.dataTransfer.files?.length){
        if(folder){await load(Number(folder.dataset.id));}
        uploadFiles([...e.dataTransfer.files]);
      }
    });
  }

  load();
  return {reload:load};
}

// ---------- clients ----------
function pcardHtml(p){
  return `<div class="pcard" data-act="open-project" data-id="${p.id}">
      <span class="key">${esc(p.key)}</span>
      ${can("ADMIN")?`<button class="bare" data-act="del-project" data-id="${p.id}" data-name="${esc(p.name)}" style="float:right;color:var(--red)">✕</button>`:""}

let CLIENT_Q="";
function renderProjects(){
  const paint=()=>{
    const q=CLIENT_Q.toLowerCase();
    const list=PROJECTS.filter(p=>(p.category==="client"||!p.category)&&
      (!q||(p.name+" "+p.key+" "+(p.customer?.name||"")+" "+(p.customer?.contactName||"")+" "+(p.customer?.customerNumber||"")).toLowerCase().includes(q)));
    const groups=new Map(); // keyed by customerId (unique) — never by name, since names can collide
    for(const p of list){
      const k=p.customerId||"none";
      if(!groups.has(k))groups.set(k,{label:p.customer?`${p.customer.name} — ${p.customer.customerNumber}`:"Unassigned customer",items:[]});
      groups.get(k).items.push(p);
    }
    const sortedKeys=[...groups.keys()].sort((a,b)=>a==="none"?1:b==="none"?-1:groups.get(a).label.localeCompare(groups.get(b).label));
    $("#clientBody").innerHTML=list.length?sortedKeys.map(k=>`
      <div style="font-family:var(--sans);font-size:12px;font-weight:700;color:var(--dim);margin:20px 0 10px">${esc(groups.get(k).label)}</div>
      <div class="pgrid">${groups.get(k).items.map(pcardHtml).join("")}</div>`).join("")
      :'<div class="empty">No projects match your search</div>';
  };
  $("#tbActions").innerHTML=`<input type="search" id="clientQ" placeholder="Search client projects…" value="${esc(CLIENT_Q)}">
    ${can("LEAD")?`<button class="primary" data-act="new-project" data-cat="client">+ New client project</button>`:""}`;
  $("#main").innerHTML=`<div id="clientBody"></div>`;
  $("#clientQ").oninput=(e)=>{CLIENT_Q=e.target.value;paint();};
  paint();
}

      fileManager($("#boardFiles"),"project",projectId,{});
      d.dataset.project=String(projectId);
    }
    d.classList.add("open");$("#overlay").classList.add("open");
  };
  $$("[data-mcol]").forEach(b=>b.onclick=()=>{
    FILTER.mcol=b.dataset.mcol;
    $$("[data-mcol]").forEach(x=>x.classList.toggle("on",x===b));
    $$(".kcol").forEach(c=>c.classList.toggle("active",c.dataset.status===FILTER.mcol));
  });
  $("#fAssignee").onchange=(e)=>{FILTER.assignee=e.target.value;paintCards();};
  $("#fq").oninput=(e)=>{FILTER.q=e.target.value;paintCards();};
  paintCards();
  $$(".kcol").forEach(col=>{
    col.ondragover=(e)=>{e.preventDefault();col.classList.add("dragover");};
    col.ondragleave=()=>col.classList.remove("dragover");
    col.ondrop=async(e)=>{e.preventDefault();col.classList.remove("dragover");
      const id=Number(e.dataTransfer.getData("text/plain")), st=col.dataset.status;
      const s=BOARD_STORIES.find(x=>x.id===id);
      if(!s||s.status===st) return;
      s.status=st;paintCards();
      try{await api("/api/tasks/"+id,{method:"PUT",body:JSON.stringify({status:st})});}
      catch(err){alert("Move failed: "+err.message);renderBoard(projectId);}};
  });
}
function paintCards(){
  const vis=BOARD_STORIES.filter(s=>
    (!FILTER.assignee||String(s.assignedTo?.id)===String(FILTER.assignee))&&
    (!FILTER.q||(s.name+" "+s.number+" "+(s.tag||"")).toLowerCase().includes(FILTER.q.toLowerCase())));
  for(const st of STATUSES){
    const items=vis.filter(s=>s.status===st);
    const cnt=$("#cnt-"+stampCls(st)); if(cnt)cnt.textContent=items.length;
    const kn=$("#kn-"+stampCls(st)); if(kn)kn.textContent=items.length;
    const list=$(`.klist[data-status="${st}"]`); if(!list)continue;
    list.innerHTML=items.map(s=>{const od=isPast(s.dueDate)&&st!=="Done";
      const a=BOARD_CRIT.get(s.id);
      return `<div class="card" draggable="true" data-act="open-task" data-id="${s.id}" ${a?.critical?`style="border-color:var(--red);box-shadow:4px 4px 0 var(--red)"`:""}>
      <div class="top"><span class="num">${esc(s.number)}</span>
        ${a?.critical?`<span class="stamp High" style="border-width:2px" title="${esc(a.criticalReasons.join(" · "))}">⚠ CRITICAL</span>`:""}</div>
      <div class="nm">${esc(s.name)}</div>
      <div class="bot"><div class="meta">
        ${s.priority==="High"?'<span style="color:var(--red);font-weight:700">HIGH</span>':""}
        ${s.dueDate?`<span class="${od?"late":""}">${od?"⚑ ":""}${fmtD(s.dueDate)}</span>`:""}
        ${s.tag?`<span>${esc(s.tag)}</span>`:""}</div>
      <div class="who" title="${esc(s.assignedTo?.displayName||"unassigned")}">${initials(s.assignedTo?.displayName)}</div></div></div>`;}).join("");
  }
  $$(".card").forEach(c=>{
    c.ondragstart=(e)=>{e.dataTransfer.setData("text/plain",c.dataset.id);c.classList.add("dragging");};
    c.ondragend=()=>c.classList.remove("dragging");
  });
}

        <div class="dsec-b"><div class="row2">
          <div><label>Status</label><select id="sst">${STATUSES.map(t=>`<option ${(s?.status||"To Do")===t?"selected":""}>${t}</option>`).join("")}</select></div>
          <div><label>Priority</label><select id="spr">${["Low","Medium","High"].map(t=>`<option ${(s?.priority||"Medium")===t?"selected":""}>${t}</option>`).join("")}</select></div>

      <div class="dsec">
        <div class="dsec-h"><span><i class="sq" style="--sc:var(--orange)"></i>People</span></div>
        <div class="dsec-b"><div class="row2">
          <div><label>Assignee</label><select id="sa" ${can("LEAD")?"":`disabled title="Only leads can assign a task"`}>${USERS.map(u=>`<option value="${u.id}" ${(s?.assignedTo?.id??ME.id)===u.id?"selected":""}>${esc(u.displayName)}</option>`).join("")}</select></div>
          <div><label>Created by</label><input value="${esc(s?.reporter?.displayName??ME.displayName)}" disabled title="Always whoever created the task"></div>
        </div></div>
      </div>
      ${isNew?"":`
      <div class="dsec">
        <div class="dsec-h"><span><i class="sq" style="--sc:var(--red)"></i>Attachments</span><span class="n" id="fcount"></span></div>
        <div class="dsec-b"><div id="flist" style="margin-top:10px"><div class="empty">loading…</div></div>

            <button class="bare" id="cimg" title="attach image">🖼</button><button class="bare" id="cadd">Post</button></div>
          <input type="file" id="cimgpick" accept="image/*" style="display:none">

        <div class="dsec-b"><div id="hlist" style="margin-top:6px"><div class="empty">loading…</div></div></div>
      </div>
    </div>`}
  </div>

  });

  if(!isNew){
    let pendingImg=null; // {base64, mime, label}
    const showPending=()=>{$("#cpending").innerHTML=pendingImg?`<div class="pending-img">🖼 ${esc(pendingImg.label)} ready to post <button class="bare" id="cimgx" style="padding:1px 6px">✕</button></div>`:"";
      const x=$("#cimgx"); if(x)x.onclick=()=>{pendingImg=null;showPending();};};
    const fileToPending=(f)=>new Promise((ok)=>{const r=new FileReader();
      r.onload=()=>{pendingImg={base64:r.result.split(",")[1],mime:f.type||"image/png",label:f.name||"screenshot"};showPending();ok();};
      r.readAsDataURL(f);});
    const loadComments=()=>api("/api/comments?taskId="+s.id).then(cs=>{
      $("#ccount").textContent=cs.length?`× ${cs.length}`:"";
      $("#clist").innerHTML=cs.length?cs.map(c=>`<div class="comment">
        <div class="ch"><b>${esc(c.user?.displayName)}</b> · ${fmtD(c.createdDate)}</div>
        ${c.text?`<p>${esc(c.text)}</p>`:""}
        ${c.imageUrl?`<a href="${c.imageUrl}" target="_blank" rel="noopener"><img src="${c.imageUrl}" alt="comment image" loading="lazy"></a>`:""}</div>`).join("")
        :'<div class="empty">No comments</div>';});
    const loadHistory=()=>api("/api/history?taskId="+s.id).then(hs=>{
      $("#hcount").textContent=hs.length?`× ${hs.length}`:"";
      const label={created:"created",status:"status",assignedTo:"assignee",reporter:"created by",dueDate:"due date",name:"title",tag:"tag",priority:"priority",description:"description"};
      $("#hlist").innerHTML=hs.length?hs.map(h=>`<div class="hist-row"><span class="ht">${new Date(h.createdDate).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span>
        <span><b>${esc(h.user?.displayName||"—")}</b> ${h.field==="created"?`created <b>${esc(h.newValue)}</b>`
          :h.field==="description"?"updated the description"
          :`changed ${label[h.field]||esc(h.field)}: ${esc(h.oldValue??"—")} <span class="arrow">→</span> <b>${esc(h.newValue??"—")}</b>`}</span></div>`).join("")
        :'<div class="empty">No changes yet</div>';});
    const loadFiles=()=>api("/api/files?taskId="+s.id).then(fs=>{
      $("#fcount").textContent=fs.length?`× ${fs.length}`:"";
      $("#flist").innerHTML=fs.length?fs.map(f=>`<div class="file-row">
        <a href="${f.url}" download>${esc(f.filename)}</a><span class="fs">${fmtSize(f.size)} · ${esc(f.uploadedBy?.displayName||"")}</span>
        <span class="sp"></span>${(can("ADMIN")||f.uploadedBy?.id===ME.id)?`<button class="bare" data-fdel="${f.id}">✕</button>`:""}</div>`).join("")
        :'<div class="empty">No files</div>';
      $$("[data-fdel]").forEach(b=>b.onclick=async()=>{try{await api("/api/files/"+b.dataset.fdel,{method:"DELETE"});}catch(e){alert(e.message);}loadFiles();});});
    loadComments();loadFiles();loadHistory();
    const postComment=async()=>{
      const t=$("#cnew").value.trim();
      if(!t&&!pendingImg)return;
      await api("/api/comments",{method:"POST",body:JSON.stringify({taskId:s.id,text:t,
        ...(pendingImg?{imageBase64:pendingImg.base64,imageMime:pendingImg.mime}:{})})});
      $("#cnew").value="";pendingImg=null;showPending();loadComments();};
    $("#cadd").onclick=postComment;
    $("#cnew").onkeydown=(e)=>{if(e.key==="Enter")postComment();};
    $("#cnew").onpaste=async(e)=>{
      const item=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));
      if(item){e.preventDefault();await fileToPending(item.getAsFile());}};
    $("#cimg").onclick=()=>$("#cimgpick").click();
    $("#cimgpick").onchange=async()=>{const f=$("#cimgpick").files[0];if(f)await fileToPending(f);$("#cimgpick").value="";};
    $("#fup").onclick=async()=>{
      const f=$("#fpick").files[0]; if(!f){alert("Choose a file first");return;}
      if(f.size>25*1024*1024){alert("Max 25 MB");return;}
      const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(f);});
      $("#fup").textContent="…";
      try{await api("/api/files",{method:"POST",body:JSON.stringify({taskId:s.id,filename:f.name,mime:f.type,dataBase64:b64})});
        $("#fpick").value="";loadFiles();}catch(e){alert(e.message);}
      $("#fup").textContent="Upload";};
    const sdel=$("#sdel");
    if(sdel)sdel.onclick=async()=>{if(!confirm(`Delete ${s.number}?`))return;
      try{await api("/api/tasks/"+s.id,{method:"DELETE"});closePanels();render();}catch(e){alert(e.message);}};
  }
  $("#ssave").onclick=async()=>{
    const body={name:$("#sn").value,description:$("#sd").value,tag:$("#sm").value,
      priority:$("#spr").value,status:$("#sst").value,dueDate:$("#sdd").value||null,
      assignedTo:{id:Number($("#sa").value)},...(isNew?{project:{id:projectId}}:{})};
    try{
      if(isNew) await api("/api/tasks",{method:"POST",body:JSON.stringify(body)});
      else await api("/api/tasks/"+s.id,{method:"PUT",body:JSON.stringify(body)});
      closePanels();render();
    }catch(e){alert(e.message);}
  };
}

    try{await api("/api/users/"+b.dataset.udel,{method:"DELETE"});
      USERS=(await api("/api/users")).filter(u=>u.enabled);renderTeam();}
    catch(e){alert(e.message);}});

// ---------- page permission (admin) ----------
// Just the access matrix: which roles can open which section. Assigning a
// person's role lives on User Management, so it isn't duplicated here.
const RBAC_PAGE_LABELS={dashboard:"Dashboard",tasks:"All Tasks",command:"Admin Dashboard",clients:"Client Projects",internal:"Internal Projects",customers:"Customers",team:"User Management"};
function renderPages(){
  // a role you don't outrank is shown but locked — an admin can see that
  // superadmins have access without being able to change it
  const locked=(role)=>role==="SUPERADMIN"||!myRole(role);
  $("#main").innerHTML=`
  <div class="block"><div class="bhead"><h2>Page permission</h2><div class="note">which roles can open which section — superadmins always have full access</div></div>
  <div class="bpad">
  <div style="overflow-x:auto">
  <table><thead><tr><th>Page</th>${ROLES.map(r=>`<th style="text-align:center">${esc(ROLE_LABEL[r]||r)}${locked(r)?' <span class="rlock" title="You can\'t change a role that outranks you">🔒</span>':""}</th>`).join("")}</tr></thead><tbody>
  ${Object.keys(RBAC_PAGE_LABELS).map(page=>`<tr>
    <td><b>${esc(RBAC_PAGE_LABELS[page])}</b></td>
    ${ROLES.map(role=>`<td style="text-align:center">
      <input type="checkbox" data-rbac="${page}" data-role="${role}" style="width:auto"
        ${locked(role)?`disabled ${role==="SUPERADMIN"||(RBAC[page]||[]).includes(role)?"checked":""}`:(RBAC[page]||[]).includes(role)?"checked":""}></td>`).join("")}
    </tr>`).join("")}
  </tbody></table></div>
  <div class="formerr" id="rbacerr"></div>
  <div style="margin-top:16px"><button class="primary" id="rbacsave">Save page access</button></div>
  </div></div>`;
  $("#rbacsave").onclick=async()=>{
    const body={};
    for(const page of Object.keys(RBAC_PAGE_LABELS)){
      // only send roles you may manage; the server keeps the rest as they were
      body[page]=ROLES.filter(role=>!locked(role)&&$(`[data-rbac="${page}"][data-role="${role}"]`).checked);
    }
    try{RBAC=await api("/api/rbac",{method:"PUT",body:JSON.stringify(body)});renderPages();}
    catch(e){$("#rbacerr").textContent=e.message;}
  };
}

// ---------- roles (admin) ----------
async function renderRoleDefs(){
  applyRoles(await api("/api/roles"));
  const editable=(d)=>!d.builtin&&myRole(d.role);
  $("#tbActions").innerHTML=`<button class="primary" id="newRole">+ New role</button>`;
  $("#main").innerHTML=`
  <div class="block"><div class="bhead"><h2>Roles</h2><div class="note">a custom role copies one of the four built-in rungs and inherits its permissions — page access is set on Page Permission</div></div>
  <div style="overflow-x:auto"><table class="tbl-compact"><thead><tr>
    <th>Role</th><th>Name</th><th>Based on</th><th>People</th><th>Pages</th><th></th></tr></thead><tbody>
  ${ROLE_DEFS.map(d=>`<tr>
    <td><b>${esc(d.label)}</b>${d.builtin?' <span class="stamp">built-in</span>':""}</td>
    <td class="mono" data-l="Name" style="font-size:11px">${esc(d.role)}</td>
    <td data-l="Based on">${esc(ROLE_LABEL[d.baseRole]||d.baseRole)}</td>
    <td class="mono" data-l="People">${d.userCount||"—"}${d.userCount!==d.activeCount?` (${d.activeCount} active)`:""}</td>
    <td data-l="Pages">${d.pages.length?d.pages.map(p=>`<span class="stamp">${esc(RBAC_PAGE_LABELS[p]||p)}</span>`).join(" "):'<span style="color:var(--dim)">none</span>'}</td>
    <td style="text-align:right;white-space:nowrap">${editable(d)
      ? `<button class="bare" data-redit="${esc(d.role)}">edit</button> <button class="bare" data-rdel="${esc(d.role)}">delete</button>`
      : `<span style="color:var(--dim);font-size:11px">${d.builtin?"fixed":"outranks you"}</span>`}</td>
  </tr>`).join("")}</tbody></table></div></div>`;
  $("#newRole").onclick=()=>roleModal(null);
  $$("[data-redit]").forEach(b=>b.onclick=()=>roleModal(ROLE_DEFS.find(d=>d.role===b.dataset.redit)));
  $$("[data-rdel]").forEach(b=>b.onclick=async()=>{
    if(!confirm(`Delete the role "${b.dataset.rdel}"? People must be moved off it first.`)) return;
    try{await api("/api/roles/"+b.dataset.rdel,{method:"DELETE"});renderRoleDefs();}
    catch(e){alert(e.message);}
  });
}

function roleModal(def){
  const bases=BUILTIN_ROLES.filter(r=>myRole(r)); // can't base a role on one above you
  const m=$("#modal");
  m.innerHTML=`<div class="mhead">${def?"Edit role":"New role"}</div><div class="mbody">
    <label>Display name</label><input id="rlLabel" value="${esc(def?.label||"")}" placeholder="e.g. Accountant">
    ${def?`<label>Name</label><input value="${esc(def.role)}" disabled>`
        :`<label>Name (stored on the account — letters, numbers, underscore)</label><input id="rlName" placeholder="e.g. ACCOUNTANT">`}
    <label>Based on</label><select id="rlBase">${bases.map(r=>`<option value="${r}" ${(def?.baseRole||"TEAMMATE")===r?"selected":""}>${esc(ROLE_LABEL[r]||r)}</option>`).join("")}</select>
    <div style="font-size:11.5px;color:var(--dim);margin-top:10px">It gets exactly the permissions of the rung it's based on. A new role also starts with that rung's page access, which you can change on Page Permission.</div>
    <div class="formerr" id="rlErr"></div></div>
  <div class="mfoot"><button data-act="close">Cancel</button><button class="primary" id="rlSave">${def?"Save":"Create role"}</button></div>`;
  m.classList.add("open");$("#overlay").classList.add("open");
  $("#rlSave").onclick=async()=>{
    const body={label:$("#rlLabel").value,baseRole:$("#rlBase").value};
    if(!def) body.name=$("#rlName").value;
    try{
      await api(def?"/api/roles/"+def.role:"/api/roles",{method:def?"PUT":"POST",body:JSON.stringify(body)});
      RBAC=await api("/api/rbac");
      closePanels();renderRoleDefs();
    }catch(e){$("#rlErr").textContent=e.message;}
  };
}

boot();
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
