<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivyah Task Manager</title>
<meta name="theme-color" content="#1A1A1A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ NEOMORPHIC SYSTEM — 5 colors only ============
   white / black / orange / red / blue. Soft-extruded surfaces via a dual
   light+dark shadow pair (tints of white/black, not new hues), generous
   radii, inset "pressed" fields instead of hard borders. */
:root{
  --paper:#ECEDF0; --paper2:#E2E4E8; --white:#FFFFFF; --ink:#1A1A1A; --dim:#6E7075;
  --orange:#FF7A00; --orange-tint:#FFE4C2; --red:#E63946; --red-tint:#FBDADC; --blue:#2F80ED; --blue-tint:#D9E8FD;
  --line:rgba(0,0,0,.08); --accent:var(--orange);
  --ns-hi:rgba(255,255,255,.85); --ns-lo:rgba(163,167,178,.55);
  --shadow:6px 6px 14px var(--ns-lo),-6px -6px 14px var(--ns-hi);
  --shadow-sm:3px 3px 8px var(--ns-lo),-3px -3px 8px var(--ns-hi);
  --shadow-inset:inset 3px 3px 7px var(--ns-lo),inset -3px -3px 7px var(--ns-hi);
  --bd:1px solid var(--line);
  --radius:16px;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);font-size:14px;line-height:1.5}
.mono{font-family:var(--mono)}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.01em}

button{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;
  background:var(--paper);color:var(--ink);border:none;padding:9px 15px;cursor:pointer;box-shadow:var(--shadow-sm);border-radius:12px;transition:box-shadow .12s,transform .1s}
button:hover{box-shadow:var(--shadow)}
button:active{box-shadow:var(--shadow-inset);transform:scale(.99)}
button.primary{background:var(--orange);color:#fff;box-shadow:3px 3px 8px rgba(255,122,0,.35)}
button.primary:hover{background:#e86e00;box-shadow:4px 4px 10px rgba(255,122,0,.4)}
button.primary:active{box-shadow:var(--shadow-inset)}
button.danger{background:var(--paper);color:var(--red)}
button.bare{box-shadow:none;background:transparent;border:1px solid var(--line);padding:5px 10px;font-weight:500}
button.bare:hover{box-shadow:none;background:rgba(0,0,0,.04)}
button.bare:active{box-shadow:none;transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
input,select,textarea{font-family:var(--sans);font-size:13.5px;background:var(--paper);color:var(--ink);
  border:none;box-shadow:var(--shadow-inset);border-radius:10px;padding:9px 12px;width:100%}
textarea{min-height:90px;resize:vertical;font-family:var(--sans)}
label{display:block;font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.01em;text-transform:none;color:var(--dim);margin:14px 0 5px}
::placeholder{color:#9a9ba0}

/* ---- shell: sidebar + main ---- */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--paper);color:var(--ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside .logo{padding:20px 16px 16px}
aside .logo .big{font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.1}
aside .logo .big b{color:var(--orange);font-weight:700}
aside .logo .tag{font-family:var(--sans);font-size:11px;margin-top:3px;color:var(--dim)}
aside nav{padding:6px 12px;display:flex;flex-direction:column;gap:3px}
aside nav a{font-family:var(--sans);font-size:13.5px;font-weight:500;letter-spacing:0;text-transform:none;
  color:var(--dim);text-decoration:none;padding:9px 12px;border-radius:10px}
aside nav a:hover{background:rgba(0,0,0,.04);color:var(--ink)}
aside nav a.on{background:var(--paper);color:var(--orange);font-weight:700;box-shadow:var(--shadow-inset)}
aside .who{border-top:var(--bd);padding:14px 16px;margin-top:auto}
aside .who .nm{font-weight:600;font-size:13px;color:var(--ink)}
aside .who .rl{font-family:var(--sans);font-size:11px;color:var(--dim)}
aside .who button{margin-top:10px;width:100%}

.mainwrap{min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:var(--bd);background:var(--paper);position:sticky;top:0;z-index:30}
.topbar h1{font-size:20px;font-weight:700}
.topbar .sub{font-family:var(--mono);font-size:11px;color:var(--dim)}
.topbar .sp{flex:1}
.bellwrap{position:relative}
.bell .dot{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:2px solid var(--white);border-radius:99px;font-size:10px;font-weight:700;padding:1px 6px}
.ndrop{position:absolute;top:110%;right:0;width:380px;background:var(--white);border:var(--bd);box-shadow:var(--shadow);z-index:60;display:none;max-height:60vh;overflow-y:auto;border-radius:var(--radius)}
.ndrop.open{display:block}
.ndrop .nitem{padding:10px 14px;border-bottom:1px solid var(--paper2);font-size:12.5px;cursor:pointer}
.ndrop .nitem:hover{background:var(--paper2)}
.ndrop .nitem.unread{border-left:3px solid var(--accent)}
.ndrop .nitem .nt{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:2px}
main{padding:24px 26px 90px}

/* ---- tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.tile{background:var(--white);border:var(--bd);box-shadow:var(--shadow);padding:14px 16px 12px;position:relative;border-radius:var(--radius)}
.tile .n{font-weight:800;font-size:30px;line-height:1}
.tile .t{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--dim);margin-top:6px}
.tile .s{font-family:var(--sans);font-size:11px;color:var(--dim);margin-top:2px}
.tile.warn{background:var(--red-tint)}
.tile.warn .n,.tile.warn .t{color:var(--red)}
.tile.go{background:var(--paper)}
.tile.go .n,.tile.go .t{color:var(--ink)}
.tile.hot{background:var(--orange-tint)}
.tile.hot .n,.tile.hot .t{color:#8a4300}

/* ---- blocks & tables ---- */
.block{background:var(--white);border:var(--bd);box-shadow:var(--shadow);margin-bottom:22px;border-radius:var(--radius);overflow:hidden}
.block .bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:var(--bd);background:var(--paper2)}
.block .bhead h2{font-size:13.5px;font-weight:700;letter-spacing:0;color:var(--ink)}
.block .bhead .note{font-family:var(--sans);font-size:11px;color:var(--dim)}
.block .bpad{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--paper2);font-size:13px}
th{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:none;background:var(--paper2);color:var(--dim)}
td.mono{font-size:11.5px}
.stamp{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;
  border:none;border-radius:6px;padding:3px 9px;background:var(--paper2);color:var(--ink)}
.stamp.High{background:var(--red-tint);color:var(--red)}
.stamp.Medium{background:var(--orange-tint);color:#8a4300}
.stamp.Low{background:var(--paper2);color:var(--dim)}
.stamp.Done{background:var(--ink);color:#fff}
.stamp.Backlog{background:var(--paper2);color:var(--dim)}
.stamp.InProgress{background:var(--orange-tint);color:#8a4300}
.stamp.InReview{background:var(--blue-tint);color:#1D5BB8}
.stamp.Bug{background:var(--red-tint);color:var(--red)}
.stamp.Issue{background:var(--blue-tint);color:#1D5BB8}
.stamp.Story{background:var(--paper2);color:var(--dim)}
.late{color:var(--red);font-family:var(--sans);font-weight:600;font-size:11.5px}
.empty{color:var(--dim);font-family:var(--sans);font-size:13px;padding:22px;text-align:center;text-transform:none;letter-spacing:0}

/* ---- projects grid ---- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{background:var(--white);border:var(--bd);box-shadow:var(--shadow);padding:16px;cursor:pointer;border-radius:var(--radius);transition:box-shadow .12s,transform .12s}
.pcard:hover{box-shadow:0 4px 14px rgba(15,15,15,.08);transform:translateY(-1px)}
.pcard:active{transform:translateY(0) scale(.995)}
.pcard .key{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;background:var(--paper2);color:var(--dim);display:inline-block;padding:2px 8px;border-radius:5px}
.pcard h3{font-size:16px;font-weight:700;margin:8px 0 3px}
.pcard .desc{color:var(--dim);font-size:12.5px;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .foot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ---- kanban ---- */
.board-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.board-head select,.board-head input{width:auto}
.board-head input[type=search]{width:220px}
.fchip{font-family:var(--sans);font-size:12.5px;font-weight:500;padding:6px 12px;border:1px solid var(--line);background:var(--white);cursor:pointer;letter-spacing:0;text-transform:none;box-shadow:none;border-radius:99px}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start}
@media(max-width:1050px){.kanban{grid-template-columns:repeat(2,1fr)}}
.kcol{border:var(--bd);background:var(--paper2);box-shadow:var(--shadow);border-radius:var(--radius);overflow:hidden}
.kcol.dragover{outline:2px dashed var(--accent);outline-offset:-6px}
.kcol .khead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--white);color:var(--ink);border-bottom:var(--bd)}
.kcol .khead h4{font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:0}
.kcol .khead .cnt{font-family:var(--sans);font-size:11px;font-weight:700;background:var(--kc);color:var(--ink);padding:1px 8px;border-radius:99px}
.kcol[data-status="In Progress"] .khead .cnt{color:#fff}
.kcol[data-status="In Review"] .khead .cnt{color:#fff}
.kcol[data-status="Done"] .khead .cnt{color:#fff}
.klist{padding:10px;display:flex;flex-direction:column;gap:10px;min-height:70px}
.card{background:var(--white);border:var(--bd);padding:10px 12px;cursor:grab;box-shadow:var(--shadow-sm);border-radius:6px}
.card:hover{box-shadow:0 3px 10px rgba(15,15,15,.08)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.35}
.card .top{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--dim)}
.card .num{letter-spacing:.03em}
.card .nm{font-size:13.5px;font-weight:600;margin:6px 0 8px;line-height:1.3}
.card .bot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .meta{font-family:var(--sans);font-size:11px;color:var(--dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .who{width:22px;height:22px;border-radius:99px;background:var(--paper2);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:9.5px;font-weight:700}

/* ---- drawer & modal ---- */
.overlay{position:fixed;inset:0;background:rgba(15,15,15,.4);z-index:50;display:none}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:96vw;background:var(--paper);border-left:var(--bd);z-index:51;
  transform:translateX(102%);transition:transform .15s ease;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(15,15,15,.08)}
.drawer.open{transform:none}
.drawer .dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--paper2);color:var(--ink);border-bottom:var(--bd)}
.drawer .dhead .num{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:0;color:var(--dim)}
.drawer .dbody{padding:2px 18px 18px;overflow-y:auto;flex:1;background:var(--paper)}
.drawer .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.drawer .dfoot{padding:12px 18px;border-top:var(--bd);display:flex;gap:10px;justify-content:space-between;background:var(--paper2)}
.drawer .dhead .stamp{border-color:var(--line);color:var(--ink)}
/* drawer section plates */
.dsec{background:var(--white);border:var(--bd);box-shadow:var(--shadow-sm);margin:14px 0;border-radius:var(--radius);overflow:hidden}
.dsec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;
  background:var(--paper2);color:var(--ink);font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:0;text-transform:none}
.dsec-h .sq{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:9px;vertical-align:-1px;background:var(--sc,var(--accent))}
.dtabs{display:flex;gap:6px;padding:10px 18px 0;border-bottom:var(--bd);background:var(--paper2)}
.dtab{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:8px 14px;border:none;background:transparent;box-shadow:none;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;border-radius:0}
.dtab:hover{background:transparent;color:var(--ink)}
.dtab.on{color:var(--ink);border-bottom-color:var(--accent)}
.dpane[hidden]{display:none}
.dsec-h .n{color:var(--dim);letter-spacing:0;font-weight:500}
.dsec-b{padding:2px 14px 14px}
.dsec-b>label:first-child,.dsec-b .row2>div>label{margin-top:12px}
.comment{padding:9px 0;border-bottom:1px solid var(--paper2)}
.comment .ch{font-family:var(--sans);font-size:11.5px;color:var(--dim)}
.comment .ch b{color:var(--ink)}
.comment p{font-size:13px;margin-top:2px}
.comment img{max-width:100%;max-height:220px;border:var(--bd);border-radius:6px;margin-top:6px;display:block;cursor:zoom-in}
.pending-img{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:11.5px;background:var(--orange-tint);border-radius:6px;padding:4px 8px;margin-top:8px}
.hist-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--paper2);font-size:12px;align-items:baseline}
.hist-row .ht{font-family:var(--mono);font-size:9.5px;color:var(--dim);min-width:86px}
.hist-row b{font-weight:700}
.hist-row .arrow{font-family:var(--sans);color:var(--dim)}
.file-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--paper2);font-size:12.5px}
.file-row a{color:var(--accent);font-weight:600;text-decoration:none}
.file-row a:hover{text-decoration:underline}
.file-row .fs{font-family:var(--sans);font-size:11px;color:var(--dim)}
.file-row .sp{flex:1}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%);width:500px;max-width:94vw;background:var(--paper);
  border:var(--bd);box-shadow:0 12px 32px rgba(15,15,15,.18);z-index:52;display:none;border-radius:12px;overflow:hidden}
.modal.open{display:block}
.modal .mhead{padding:14px 18px;background:var(--paper2);color:var(--ink);font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:0;text-transform:none;border-bottom:var(--bd)}
.modal .mbody{padding:6px 18px 18px;max-height:70vh;overflow-y:auto}
.modal .mfoot{padding:12px 18px;border-top:var(--bd);display:flex;justify-content:flex-end;gap:10px;background:var(--paper2)}
.formerr{color:var(--red);font-family:var(--sans);font-size:12px;font-weight:600;margin-top:10px;min-height:14px}

/* ---- login ---- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--paper2)}
.login{width:400px;background:var(--white);border:var(--bd);box-shadow:0 12px 32px rgba(15,15,15,.1);padding:30px;border-radius:14px}
.login .big{font-weight:800;font-size:32px;line-height:1.05;text-transform:none;letter-spacing:-.01em}
.login .big b{color:var(--accent);font-weight:800}
.login .tag{font-family:var(--sans);font-size:12px;color:var(--dim);margin:8px 0 4px;text-transform:none;letter-spacing:0}

/* ---- product lab (same design system as the rest of the app) ---- */
.prod-hero{position:relative;border:var(--bd);border-radius:var(--radius);background:var(--white);
  padding:22px 26px;margin-bottom:22px;box-shadow:var(--shadow)}
.prod-hero h2{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.prod-hero h2 b{color:var(--accent)}
.prod-hero .ph-sub{font-size:13px;color:var(--dim);margin-top:4px;max-width:560px}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.prodcard{border:var(--bd);border-radius:var(--radius);background:var(--white);padding:18px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.prodcard:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(15,15,15,.08)}
.prodcard .pc-top{display:flex;gap:12px;align-items:center}
.prodcard h3{font-size:16px;font-weight:700;color:var(--ink)}
.prodcard .pc-key{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;background:var(--paper2);color:var(--dim);display:inline-block;padding:2px 8px;border-radius:5px}
.prodcard .pc-desc{font-size:12.5px;color:var(--dim);margin-top:2px}
.pc-progress{margin-top:16px}
.pc-progress .lbl{display:flex;justify-content:space-between;font-family:var(--sans);font-size:11px;color:var(--dim);margin-bottom:5px}
.pc-bar{height:8px;border-radius:99px;background:var(--paper2);overflow:hidden}
.pc-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pc-mini{display:flex;gap:6px;margin-top:12px}
.pc-mini span{flex:1;text-align:center;font-family:var(--sans);font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:5px 2px;background:var(--paper2)}
.pc-mini .n{display:block;font-size:15px;font-weight:700;color:var(--ink)}
.pc-sugg{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.pc-sugg li{list-style:none;font-size:12px;color:var(--dim);padding:3px 0 3px 20px;position:relative}
.pc-sugg li::before{content:"·";position:absolute;left:4px;font-weight:700}
.pc-sugg li.warn{color:var(--red)}
.pc-sugg li.warn::before{content:"!"}
.pc-target{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:600;border-radius:5px;padding:2px 8px;background:var(--orange-tint);color:#8a4300;margin-top:2px}
.pc-target.passed{background:var(--red-tint);color:var(--red)}

/* ---- mobile ---- */
.menu-btn{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:260px;max-width:82vw;height:100dvh;z-index:80;
    transform:translateX(-103%);transition:transform .16s ease;box-shadow:4px 0 20px rgba(15,15,15,.2)}
  aside.open{transform:none}
  .menu-btn{display:inline-block}
  .topbar{padding:12px 14px;gap:10px}
  .topbar h1{font-size:17px}
  .topbar .sub{display:none}
  main{padding:16px 14px 70px}
  .ndrop{position:fixed;top:64px;left:10px;right:10px;width:auto}
  .drawer{width:100vw;max-width:100vw}
  .drawer .row2{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr);gap:10px}
  .tile .n{font-size:26px}
  .board-head input[type=search]{width:100%;order:9}
}
/* kanban status tabs — mobile shows one column at a time */
.ktabs{display:none}
@media(max-width:700px){
  .ktabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
  .ktabs .fchip{white-space:nowrap}
  .ktabs .fchip .kn{display:inline-block;min-width:16px;text-align:center;background:var(--orange-tint);color:var(--ink);margin-left:6px;padding:0 3px;border-radius:4px}
  .ktabs .fchip.on .kn{background:#fff;color:var(--ink)}
  .kanban{display:block}
  .kanban .kcol{display:none}
  .kanban .kcol.active{display:block}

  /* tables become stacked cards — no horizontal scrolling */
  table.cardify thead{display:none}
  table.cardify, table.cardify tbody{display:block}
  table.cardify tr{display:block;border-bottom:var(--bd);padding:10px 14px}
  table.cardify tr:last-child{border-bottom:none}
  table.cardify td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:none;padding:3px 0;text-align:right}
  table.cardify td::before{content:attr(data-l);font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:left;flex-shrink:0}
  table.cardify td:first-child{font-size:14.5px;font-weight:600;text-align:left;justify-content:flex-start}
  table.cardify td:first-child::before{display:none}
  table.cardify td:empty{display:none}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUSES=["Backlog","In Progress","In Review","Done"];
const KC={Backlog:"#E2E4E8","In Progress":"#FF7A00","In Review":"#2F80ED",Done:"#1A1A1A"};
const fmtD=(d)=>d?new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"";
const fmtSize=(b)=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const initials=(n)=>String(n||"?").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const stampCls=(v)=>String(v||"").replace(/\s/g,"");
const stampLabel=(v)=>v==="Done"?"✓ Done":esc(v);
const isPast=(d)=>d&&new Date(d)<new Date(new Date().toDateString());

let ME=null, USERS=[], PROJECTS=[], STORIES=[], NOTIFS=[], BOARD_STORIES=[], BOARD_CRIT=new Map(), RBAC={};
let FILTER={type:"all",assignee:"",q:""};
const isLead=()=>ME&&(ME.role==="ADMIN"||ME.role==="DEVLEAD");
const canSeePage=(page)=>ME&&(ME.role==="ADMIN"||(RBAC[page]||[]).includes(ME.role));

async function api(path,opts={}){
  const res=await fetch(path,{...opts,headers:{...(opts.body?{"Content-Type":"application/json"}:{}),...(opts.headers||{})}});
  if(res.status===401&&!path.includes("/auth/")){ME=null;render();throw new Error("Session expired — sign in again");}
  const body=await res.json().catch(()=>null);
  if(!res.ok) throw new Error(body?.error||("HTTP "+res.status));
  return body;
}

function route(){
  const h=location.hash||"#/dashboard";
  const m=/^#\/board\/(\d+)/.exec(h);
  if(m) return {view:"board",projectId:Number(m[1])};
  const rt=/^#\/reset\/([\w-]+)/.exec(h);
  if(rt) return {view:"reset",token:rt[1]};
  if(h.startsWith("#/tasks")) return {view:"tasks"};
  if(h.startsWith("#/products")) return {view:"products"};
  if(h.startsWith("#/clients")||h.startsWith("#/projects")) return {view:"clients"};
  if(h.startsWith("#/internal")) return {view:"internal"};
  if(h.startsWith("#/command")) return {view:"command"};
  if(h.startsWith("#/team")) return {view:"team"};
  if(h.startsWith("#/access")) return {view:"access"};
  return {view:"dashboard"};
}
window.addEventListener("hashchange",()=>render());

// ---------- boot ----------
async function boot(){
  const st=await api("/api/auth/status");
  if(!st.authenticated){ME=null;render();return;}
  const users=await api("/api/users");
  ME=users.find(u=>u.username===st.username);
  USERS=users.filter(u=>u.enabled);
  [PROJECTS,RBAC]=await Promise.all([api("/api/pm-projects"),api("/api/rbac").catch(()=>({}))]);
  await refreshNotifs();
  render();
}
async function refreshNotifs(){
  if(!ME?.id) return;
  try{NOTIFS=await api("/api/notifications/user/"+ME.id);}catch{}
  const b=$("#nBadge"); if(b){const u=NOTIFS.filter(n=>!n.read).length; b.outerHTML=badgeHtml(u);}
}
setInterval(refreshNotifs,45_000);
const badgeHtml=(u)=>u?`<span class="dot" id="nBadge">${u}</span>`:`<span id="nBadge"></span>`;

// ---------- render shell ----------
function render(){
  const app=$("#app");
  const r0=route();
  if(r0.view==="reset"){app.innerHTML=resetView(r0.token);return;}
  if(!ME){app.innerHTML=loginView();return;}
  const r=r0;
  const unread=NOTIFS.filter(n=>!n.read).length;
  const boardProject=r.view==="board"?PROJECTS.find(p=>p.id===r.projectId):null;
  const titles={dashboard:"My Dashboard",tasks:"All Tasks",command:"Command",products:"Products",clients:"Clients",internal:"Internal Works",team:"Team",access:"Access Control",board:boardProject?.name||"Board"};
  app.innerHTML=`
  <div class="shell">
    <aside>
      <div class="logo"><div class="big">Trivyah</div><div class="tag">Task Manager</div></div>
      <nav>
        ${canSeePage("dashboard")?`<a href="#/dashboard" class="${r.view==="dashboard"?"on":""}">Dashboard</a>`:""}
        ${canSeePage("tasks")?`<a href="#/tasks" class="${r.view==="tasks"?"on":""}">All Tasks</a>`:""}
        ${canSeePage("command")?`<a href="#/command" class="${r.view==="command"?"on":""}">Command</a>`:""}
        ${canSeePage("products")?`<a href="#/products" class="${r.view==="products"?"on":""}">Products</a>`:""}
        ${canSeePage("clients")?`<a href="#/clients" class="${r.view==="clients"?"on":""}">Clients</a>`:""}
        ${canSeePage("internal")?`<a href="#/internal" class="${r.view==="internal"?"on":""}">Internal Works</a>`:""}
        ${canSeePage("team")?`<a href="#/team" class="${r.view==="team"?"on":""}">Team</a>`:""}
        ${ME.role==="ADMIN"?`<a href="#/access" class="${r.view==="access"?"on":""}">Access Control</a>`:""}
      </nav>
      <div class="who"><div class="nm">${esc(ME.displayName)}</div><div class="rl">${esc(ME.role)}</div>
        <button data-act="logout">Log out</button></div>
    </aside>
    <div class="mainwrap">
      <div class="topbar"><button class="bare menu-btn" data-act="menu" aria-label="Menu">☰</button><h1>${esc(titles[r.view])}</h1>
        <span class="sub">${r.view==="board"?esc(PROJECTS.find(p=>p.id===r.projectId)?.key||""):""}</span>
        <span class="sp"></span>
        <div class="bellwrap"><button class="bare" data-act="bell">▤ Inbox${badgeHtml(unread)}</button>
          <div class="ndrop" id="ndrop">${NOTIFS.length?NOTIFS.map(n=>`
            <div class="nitem ${n.read?"":"unread"}" data-act="notif" data-story="${n.storyId||""}">${esc(n.text)}
            <div class="nt">${fmtD(n.createdDate)}</div></div>`).join("")
            :'<div class="empty">Inbox zero</div>'}</div></div>
      </div>
      <main id="main"></main>
    </div>
  </div>
  <div class="overlay" id="overlay" data-act="close"></div>
  <div class="drawer" id="drawer"></div>
  <div class="modal" id="modal"></div>`;
  if(r.view!=="board"&&r.view!=="access"&&!canSeePage(r.view)){location.hash="#/dashboard";return;}
  if(r.view==="dashboard") renderDashboard();
  else if(r.view==="tasks") renderTasks();
  else if(r.view==="command") renderCommand();
  else if(r.view==="products") renderProducts();
  else if(r.view==="clients") renderProjects();
  else if(r.view==="internal") renderInternal();
  else if(r.view==="team") renderTeam();
  else if(r.view==="access"){if(ME.role!=="ADMIN"){location.hash="#/dashboard";return;}renderAccess();}
  else renderBoard(r.projectId);
}
function closePanels(){$("#overlay")?.classList.remove("open");$("#drawer")?.classList.remove("open");$("#modal")?.classList.remove("open");$("aside")?.classList.remove("open");}

// ---------- global event delegation (robust: no per-node handlers) ----------
document.addEventListener("click",async(e)=>{
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const act=el.dataset.act;
  if(act==="menu"){$("aside").classList.toggle("open");$("#overlay").classList.toggle("open",$("aside").classList.contains("open"));}
  else if(act==="logout"){await api("/api/auth/logout",{method:"POST"});ME=null;render();}
  else if(act==="bell"){
    $("#ndrop").classList.toggle("open");
    const unread=NOTIFS.filter(n=>!n.read);
    for(const n of unread) api(`/api/notifications/${n.id}/read`,{method:"PUT"}).catch(()=>{});
    NOTIFS=NOTIFS.map(n=>({...n,read:1}));
    const b=$("#nBadge"); if(b) b.outerHTML=badgeHtml(0);
  }
  else if(act==="notif"&&el.dataset.story){
    try{const s=await api("/api/pm-stories/"+el.dataset.story);
      $("#ndrop").classList.remove("open");
      location.hash="#/board/"+s.project.id;
      setTimeout(()=>storyDrawer(s,s.project.id),150);
    }catch{}
  }
  else if(act==="close") closePanels();
  else if(act==="del-project"){
    if(!confirm(`Delete project "${el.dataset.name}" AND all its stories, comments and files? This cannot be undone.`))return;
    try{await api("/api/pm-projects/"+el.dataset.id,{method:"DELETE"});
      PROJECTS=await api("/api/pm-projects");render();}
    catch(err){alert(err.message);}
  }
  else if(act==="open-project") location.hash="#/board/"+el.dataset.id;
  else if(act==="new-project") projectModal(el.dataset.cat||"client");
  else if(act==="project-settings") projectSettingsModal(PROJECTS.find(p=>p.id===Number(el.dataset.id)));
  else if(act==="new-user") userModal();
  else if(act==="new-story") storyDrawer(null,Number(el.dataset.project));
  else if(act==="open-story"){
    const s=BOARD_STORIES.find(x=>x.id===Number(el.dataset.id))||STORIES.find(x=>x.id===Number(el.dataset.id));
    if(s) storyDrawer(s,s.project?.id||s.projectId);
  }
});
document.addEventListener("keydown",(e)=>{if(e.key==="Escape")closePanels();});

// ---------- login ----------
function loginView(){setTimeout(()=>{
  $("#loginForm").onsubmit=async(e)=>{e.preventDefault();
    try{await api("/api/auth/login",{method:"POST",body:JSON.stringify({username:$("#lu").value,password:$("#lp").value})});boot();}
    catch(err){$("#lerr").textContent=/401|credential/i.test(err.message)?"WRONG USERNAME OR PASSWORD":err.message;}};
  $("#forgot").onclick=async(e)=>{e.preventDefault();
    const uname=$("#lu").value.trim()||prompt("Your username or email:");
    if(!uname)return;
    await api("/api/auth/forgot",{method:"POST",body:JSON.stringify({username:uname})}).catch(()=>{});
    alert("If that account has an email on file, a reset link was sent. Otherwise ask your admin for a reset link.");};
},0);
return `<div class="login-wrap"><form class="login" id="loginForm">
  <div class="big">Trivyah Task Manager</div><div class="tag">Projects · Issues · Kanban</div>
  <label>Username</label><input id="lu" autocomplete="username" required>
  <label>Password</label><input id="lp" type="password" autocomplete="current-password" required>
  <div class="formerr" id="lerr"></div>
  <button class="primary" style="width:100%;margin-top:8px">Sign in →</button>
  <div style="margin-top:14px;text-align:center"><a href="#" id="forgot" style="font-family:var(--mono);font-size:11px;color:var(--dim)">Forgot password?</a></div>
</form></div>`;}

function resetView(token){setTimeout(()=>{
  $("#resetForm").onsubmit=async(e)=>{e.preventDefault();
    if($("#rp1").value!==$("#rp2").value){$("#rerr").textContent="PASSWORDS DON'T MATCH";return;}
    try{
      await api("/api/auth/reset",{method:"POST",body:JSON.stringify({token,password:$("#rp1").value})});
      alert("Password set — sign in with it now.");
      location.hash="";location.reload();
    }catch(err){$("#rerr").textContent=err.message;}};
},0);
return `<div class="login-wrap"><form class="login" id="resetForm">
  <div class="big">Trivyah Task Manager</div><div class="tag">Set a new password</div>
  <label>New password</label><input id="rp1" type="password" autocomplete="new-password" required>
  <label>Repeat it</label><input id="rp2" type="password" autocomplete="new-password" required>
  <div class="formerr" id="rerr"></div>
  <button class="primary" style="width:100%;margin-top:8px">Set password →</button>
</form></div>`;}

// ---------- dashboard ----------
let ANALYTICS=null;
const tiles=(arr)=>arr.map(([n,t,s,cls])=>`<div class="tile ${cls||""}"><div class="n">${n}</div><div class="t">${t}</div><div class="s">${s||""}</div></div>`).join("");

async function renderDashboard(){
  STORIES=await api("/api/pm-stories"); // server-side scoped to my visibility
  const open=STORIES.filter(s=>s.storyStatus!=="Done");
  const mine=open.filter(s=>s.assignedTo?.id===ME.id);
  const week=new Date(Date.now()+7*86400e3).toISOString().slice(0,10);
  let html="";
  // personal section (everyone)
  const myOver=mine.filter(s=>isPast(s.dueDate));
  const dueSoon=mine.filter(s=>s.dueDate&&!isPast(s.dueDate)&&s.dueDate<=week);
  html+=`<div class="tiles">${tiles([
    [mine.length,"My open items","assigned to me"],
    [dueSoon.length,"Due this week",""],
    [myOver.length,"My overdue","",myOver.length?"warn":"go"],
    [STORIES.filter(s=>s.assignedTo?.id===ME.id&&s.storyStatus==="Done").length,"Done total","all time"],
  ])}</div>
  <div class="block"><div class="bhead"><h2>My queue</h2><div class="note">everything assigned to me, urgent first</div></div>
    ${mine.length?`<table class="cardify"><thead><tr><th>Item</th><th>Project</th><th>Type</th><th>Status</th><th>Priority</th><th>Due</th></tr></thead><tbody>
    ${mine.sort((a,b)=>String(a.dueDate||"9999").localeCompare(String(b.dueDate||"9999")))
      .map(s=>`<tr data-act="open-story" data-id="${s.id}" style="cursor:pointer">
      <td><span class="mono" style="font-size:11px">${esc(s.number)}</span> ${esc(s.name)}</td>
      <td class="mono" data-l="Project">${esc(s.project?.key||"")}</td>
      <td data-l="Type"><span class="stamp ${stampCls(s.type)}">${esc(s.type)}</span></td>
      <td data-l="Status"><span class="stamp ${stampCls(s.storyStatus)}">${stampLabel(s.storyStatus)}</span></td>
      <td data-l="Priority"><span class="stamp ${stampCls(s.priority)}">${esc(s.priority)}</span></td>
      <td data-l="Due">${s.dueDate?(isPast(s.dueDate)?`<span class="late">${fmtD(s.dueDate)} ⚑</span>`:fmtD(s.dueDate)):"—"}</td></tr>`).join("")}</tbody></table>`
    :'<div class="empty">Nothing assigned to you. Enjoy it while it lasts.</div>'}</div>`;
  $("#main").innerHTML=html;
}

// ---------- all tasks (filter by client / project / dev-devlead) ----------
let TASK_FILTER={client:"",project:"",assignee:"",status:"",type:"",q:""};
async function renderTasks(){
  STORIES=await api("/api/pm-stories"); // server-side scoped to my visibility
  const clientNames=[...new Set(PROJECTS.filter(p=>p.category==="client"&&p.clientName).map(p=>p.clientName))].sort();
  $("#main").innerHTML=`
  <div class="board-head">
    <select id="tfClient" style="width:auto"><option value="">All clients</option>
      ${clientNames.map(c=>`<option value="${esc(c)}" ${TASK_FILTER.client===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <select id="tfProject" style="width:auto"><option value="">All projects</option>
      ${PROJECTS.map(p=>`<option value="${p.id}" ${String(TASK_FILTER.project)===String(p.id)?"selected":""}>${esc(p.key)} — ${esc(p.name)}</option>`).join("")}</select>
    <select id="tfAssignee" style="width:auto"><option value="">Everyone</option>
      ${USERS.map(u=>`<option value="${u.id}" ${String(TASK_FILTER.assignee)===String(u.id)?"selected":""}>${esc(u.displayName)}</option>`).join("")}</select>
    <select id="tfStatus" style="width:auto"><option value="">Any status</option>
      ${STATUSES.map(s=>`<option ${TASK_FILTER.status===s?"selected":""}>${s}</option>`).join("")}</select>
    <select id="tfType" style="width:auto"><option value="">Any type</option>
      ${["Story","Issue","Bug"].map(t=>`<option ${TASK_FILTER.type===t?"selected":""}>${t}</option>`).join("")}</select>
    <input type="search" id="tfQ" placeholder="SEARCH…" value="${esc(TASK_FILTER.q)}">
  </div>
  <div class="block"><div class="bhead"><h2>Tasks</h2><div class="note" id="tfCount"></div></div>
    <div id="tfBody"></div></div>`;
  const paint=()=>{
    const vis=STORIES.filter(s=>
      (!TASK_FILTER.client||s.project?.clientName===TASK_FILTER.client)&&
      (!TASK_FILTER.project||String(s.project?.id)===String(TASK_FILTER.project))&&
      (!TASK_FILTER.assignee||String(s.assignedTo?.id)===String(TASK_FILTER.assignee))&&
      (!TASK_FILTER.status||s.storyStatus===TASK_FILTER.status)&&
      (!TASK_FILTER.type||s.type===TASK_FILTER.type)&&
      (!TASK_FILTER.q||(s.name+" "+s.number+" "+(s.module||"")).toLowerCase().includes(TASK_FILTER.q.toLowerCase())));
    $("#tfCount").textContent=`${vis.length} item${vis.length===1?"":"s"}`;
    $("#tfBody").innerHTML=vis.length?`<table class="cardify"><thead><tr><th>Item</th><th>Project</th><th>Client</th><th>Assignee</th><th>Type</th><th>Status</th><th>Priority</th><th>Due</th></tr></thead><tbody>
      ${vis.sort((a,b)=>String(a.dueDate||"9999").localeCompare(String(b.dueDate||"9999")))
        .map(s=>`<tr data-act="open-story" data-id="${s.id}" style="cursor:pointer">
        <td><span class="mono" style="font-size:11px">${esc(s.number)}</span> ${esc(s.name)}</td>
        <td class="mono" data-l="Project">${esc(s.project?.key||"")}</td>
        <td data-l="Client">${esc(s.project?.clientName||"—")}</td>
        <td data-l="Assignee">${esc(s.assignedTo?.displayName||"—")}</td>
        <td data-l="Type"><span class="stamp ${stampCls(s.type)}">${esc(s.type)}</span></td>
        <td data-l="Status"><span class="stamp ${stampCls(s.storyStatus)}">${stampLabel(s.storyStatus)}</span></td>
        <td data-l="Priority"><span class="stamp ${stampCls(s.priority)}">${esc(s.priority)}</span></td>
        <td data-l="Due">${s.dueDate?(isPast(s.dueDate)&&s.storyStatus!=="Done"?`<span class="late">${fmtD(s.dueDate)} ⚑</span>`:fmtD(s.dueDate)):"—"}</td></tr>`).join("")}</tbody></table>`
      :'<div class="empty">No tasks match these filters</div>';
  };
  $("#tfClient").onchange=(e)=>{TASK_FILTER.client=e.target.value;paint();};
  $("#tfProject").onchange=(e)=>{TASK_FILTER.project=e.target.value;paint();};
  $("#tfAssignee").onchange=(e)=>{TASK_FILTER.assignee=e.target.value;paint();};
  $("#tfStatus").onchange=(e)=>{TASK_FILTER.status=e.target.value;paint();};
  $("#tfType").onchange=(e)=>{TASK_FILTER.type=e.target.value;paint();};
  $("#tfQ").oninput=(e)=>{TASK_FILTER.q=e.target.value;paint();};
  paint();
}

// ---------- command (admin/devlead: performance & allocation) ----------
async function renderCommand(){
  if(!isLead()){location.hash="#/dashboard";return;}
  [STORIES,ANALYTICS]=await Promise.all([api("/api/pm-stories"),api("/api/analytics")]);
  const open=STORIES.filter(s=>s.storyStatus!=="Done");
  let html="";
  {
    const overdue=open.filter(s=>isPast(s.dueDate));
    const unassigned=open.filter(s=>!s.assignedTo);
    const devs=USERS.filter(u=>open.some(s=>s.assignedTo?.id===u.id));
    html+=`<div class="tiles">${tiles([
      [open.length,"Open items","across "+PROJECTS.length+" projects"],
      [overdue.length,"Overdue",overdue.length?"needs action":"clean board",overdue.length?"warn":"go"],
      [unassigned.length,"Unassigned","waiting for an owner",unassigned.length?"hot":""],
      [devs.length,"People loaded","have open work"],
    ])}</div>
    <div class="grid2">
      <div class="block"><div class="bhead"><h2>Team load</h2><div class="note">open items per person</div></div>
        <table class="cardify"><thead><tr><th>Person</th><th>Open</th><th>Pts</th><th>Overdue</th><th>Doing now</th></tr></thead><tbody>
        ${devs.map(u=>{const m=open.filter(s=>s.assignedTo?.id===u.id);
          const od=m.filter(s=>isPast(s.dueDate)).length;
          const doing=m.find(s=>s.storyStatus==="In Progress");
          return `<tr><td><b>${esc(u.displayName)}</b></td><td class="mono" data-l="Open">${m.length}</td>
          <td class="mono" data-l="Points">${m.reduce((n,s)=>n+(s.storyPoints||0),0)}</td>
          <td data-l="Overdue">${od?`<span class="late">${od}</span>`:"—"}</td>
          <td data-l="Doing now">${doing?`<span class="mono" style="font-size:11px">${esc(doing.number)}</span> ${esc(doing.name).slice(0,28)}`:"<span style='color:var(--dim)'>idle</span>"}</td></tr>`;}).join("")}
        </tbody></table>${devs.length?"":'<div class="empty">nobody has open work</div>'}</div>
      <div class="block"><div class="bhead"><h2>Project health</h2><div class="note">items by status</div></div>
        <table class="cardify"><thead><tr><th>Project</th><th>Back</th><th>Prog</th><th>Rev</th><th>Done</th><th>Overdue</th></tr></thead><tbody>
        ${PROJECTS.map(p=>{const ps=STORIES.filter(s=>s.project?.id===p.id);
          const c=(st)=>ps.filter(s=>s.storyStatus===st).length;
          const od=ps.filter(s=>s.storyStatus!=="Done"&&isPast(s.dueDate)).length;
          return `<tr><td data-act="open-project" data-id="${p.id}" style="cursor:pointer"><b>${esc(p.key)}</b> ${esc(p.name).slice(0,24)}</td>
          <td class="mono" data-l="Backlog">${c("Backlog")}</td><td class="mono" data-l="In progress">${c("In Progress")}</td><td class="mono" data-l="In review">${c("In Review")}</td>
          <td class="mono" data-l="Done">${c("Done")}</td><td data-l="Overdue">${od?`<span class="late">${od}</span>`:"—"}</td></tr>`;}).join("")}</tbody></table></div>
    </div>`;
  }
  // effort scoreboard + critical items
  const crit=(ANALYTICS?.stories||[]).filter(a=>a.critical);
  {
    const devsRanked=ANALYTICS?.devs||[];
    html+=`<div class="grid2">
      <div class="block"><div class="bhead"><h2>Effort scoreboard</h2><div class="note">points earned − delay/rework penalties</div></div>

// ---------- product lab ----------
let PROD_Q="";
async function renderProducts(){
  const all=PROJECTS.filter(p=>p.category==="product");
  const year=new Date().getFullYear();
  let an=null, stories=[];
  try{[stories,an]=await Promise.all([api("/api/pm-stories"),api("/api/analytics")]);}catch{}
  const critByProject=new Map();
  for(const a of (an?.stories||[])) if(a.critical) critByProject.set(a.projectId,(critByProject.get(a.projectId)||0)+1);

  const prodCard=(p)=>{
    const ps=stories.filter(s=>s.project?.id===p.id);
    const yearStories=ps.filter(s=>String(s.createdDate).startsWith(String(year)));
    const done=yearStories.filter(s=>s.storyStatus==="Done").length;
    const pct=yearStories.length?Math.round(done/yearStories.length*100):0;
    const open=ps.filter(s=>s.storyStatus!=="Done");
    const overdue=open.filter(s=>isPast(s.dueDate)).length;
    const unassigned=open.filter(s=>!s.assignedTo).length;
    const critN=critByProject.get(p.id)||0;
    const sugg=[];
    if(critN)sugg.push({t:`${critN} critical item${critN>1?"s":""} — churning or badly late`,w:1});
    if(overdue)sugg.push({t:`${overdue} overdue — reschedule or reassign`,w:1});
    if(unassigned)sugg.push({t:`${unassigned} unassigned — pick owners`,w:0});
    if(p.targetDate&&isPast(p.targetDate)&&open.length)sugg.push({t:`target date passed with ${open.length} open — replan the milestone`,w:1});
    if(!open.length)sugg.push({t:"backlog empty — plan the next milestone",w:0});
    if(!sugg.length)sugg.push({t:"on track — keep shipping",w:0});
    return `<div class="prodcard" data-act="open-project" data-id="${p.id}">
      <div class="pc-top"><div>
        <div class="pc-key">${esc(p.key)} · PRODUCT ${p.version?`· ${esc(p.version)}`:""}</div><h3>${esc(p.name)}</h3>
        <div class="pc-desc">${esc(p.description||"")}</div>
        ${p.targetDate?`<span class="pc-target ${isPast(p.targetDate)?"passed":""}">target ${fmtD(p.targetDate)}</span>`:""}</div></div>
      <div class="pc-progress"><div class="lbl"><span>${year} progress</span><span>${done}/${yearStories.length} · ${pct}%</span></div>
        <div class="pc-bar"><i style="width:${pct}%"></i></div></div>
      <div class="pc-mini">
        ${["Backlog","In Progress","In Review","Done"].map(st=>`<span><span class="n">${ps.filter(s=>s.storyStatus===st).length}</span>${st.replace("In ","")}</span>`).join("")}
      </div>
      <ul class="pc-sugg">${sugg.slice(0,3).map(s=>`<li class="${s.w?"warn":""}">${esc(s.t)}</li>`).join("")}</ul>
    </div>`;
  };

  const paint=()=>{
    const q=PROD_Q.toLowerCase();
    const products=all.filter(p=>!q||(p.name+" "+p.key+" "+(p.version||"")+" "+(p.assignedTo?.displayName||"")).toLowerCase().includes(q));
    const groups=new Map();
    for(const p of products){
      const k=p.assignedTo?.displayName||"Unassigned devlead";
      if(!groups.has(k))groups.set(k,[]);
      groups.get(k).push(p);
    }
    const sortedKeys=[...groups.keys()].sort((a,b)=>a==="Unassigned devlead"?1:b==="Unassigned devlead"?-1:a.localeCompare(b));
    $("#prodBody").innerHTML=products.length?sortedKeys.map(k=>`
      <div style="font-family:var(--sans);font-size:12px;font-weight:700;color:var(--dim);margin:20px 0 10px">${esc(k)}</div>
      <div class="prod-grid">${groups.get(k).map(prodCard).join("")}</div>`).join("")
      :'<div class="empty">No products match your search — create SCM, HRMS, POS… or flip an existing project to Product in its ⚙ Settings.</div>';
  };

  $("#main").innerHTML=`
  <div class="prod-hero">
    <h2>Trivyah <b>Product Lab</b></h2>
    <div class="ph-sub">Yearly build plan for our own products — SCM, HRMS, POS and friends. Track ${year} targets, watch progress, and act on the suggestions.</div>
  </div>
  <div class="board-head" style="justify-content:flex-end">
    <input type="search" id="prodQ" placeholder="SEARCH PRODUCTS…" value="${esc(PROD_Q)}" style="max-width:260px">
    <button class="primary" data-act="new-project" data-cat="product">+ New product</button>
  </div>
  <div id="prodBody"></div>`;
  $("#prodQ").oninput=(e)=>{PROD_Q=e.target.value;paint();};
  paint();
}

async function renderBoard(projectId){

    api("/api/pm-stories?projectId="+projectId),
    api("/api/analytics?projectId="+projectId).catch(()=>null)]);
  BOARD_CRIT=new Map((boardAnalytics?.stories||[]).map(a=>[a.id,a]));
  $("#main").innerHTML=`
  <div class="board-head">
    ${["all","Story","Issue","Bug"].map(t=>`<button class="fchip ${FILTER.type===t?"on":""}" data-f="${t}">${t}</button>`).join("")}
    <select id="fAssignee" style="width:auto"><option value="">everyone</option>
      ${USERS.map(u=>`<option value="${u.id}" ${String(FILTER.assignee)===String(u.id)?"selected":""}>${esc(u.displayName)}</option>`).join("")}</select>
    <input type="search" id="fq" placeholder="SEARCH…" value="${esc(FILTER.q)}">
    <span style="flex:1"></span>
    ${(ME.role==="ADMIN"||p.assignedTo?.id===ME.id||(ME.role==="DEVLEAD"&&String(p.assignees||"").split(",").map(Number).includes(ME.id)))?`<button data-act="project-settings" data-id="${projectId}">⚙ Settings</button>`:""}
    ${ME.role!=="DEV"?`<button class="primary" data-act="new-story" data-project="${projectId}">+ New item</button>`:""}
  </div>
  <div class="ktabs">${STATUSES.map(st=>`
    <button class="fchip ${(FILTER.mcol||"Backlog")===st?"on":""}" data-mcol="${st}">${st}<span class="kn" id="kn-${stampCls(st)}">0</span></button>`).join("")}</div>
  <div class="kanban">${STATUSES.map(st=>`
    <div class="kcol ${(FILTER.mcol||"Backlog")===st?"active":""}" data-status="${st}">
      <div class="khead"><h4>${st}</h4><span class="cnt" style="--kc:${KC[st]};background:${KC[st]}" id="cnt-${stampCls(st)}"></span></div>
      <div class="klist" data-status="${st}"></div>
    </div>`).join("")}</div>`;
  $$("[data-mcol]").forEach(b=>b.onclick=()=>{
    FILTER.mcol=b.dataset.mcol;
    $$("[data-mcol]").forEach(x=>x.classList.toggle("on",x===b));
    $$(".kcol").forEach(c=>c.classList.toggle("active",c.dataset.status===FILTER.mcol));
  });
  $$(".board-head .fchip").forEach(b=>b.onclick=()=>{FILTER.type=b.dataset.f;renderBoard(projectId);});
  $("#fAssignee").onchange=(e)=>{FILTER.assignee=e.target.value;paintCards();};
  $("#fq").oninput=(e)=>{FILTER.q=e.target.value;paintCards();};
  paintCards();
  $$(".kcol").forEach(col=>{
    col.ondragover=(e)=>{e.preventDefault();col.classList.add("dragover");};
    col.ondragleave=()=>col.classList.remove("dragover");
    col.ondrop=async(e)=>{e.preventDefault();col.classList.remove("dragover");
      const id=Number(e.dataTransfer.getData("text/plain")), st=col.dataset.status;
      const s=BOARD_STORIES.find(x=>x.id===id);
      if(!s||s.storyStatus===st) return;
      s.storyStatus=st;paintCards();
      try{await api("/api/pm-stories/"+id,{method:"PUT",body:JSON.stringify({storyStatus:st})});}
      catch(err){alert("Move failed: "+err.message);renderBoard(projectId);}};
  });
}
function paintCards(){
  const vis=BOARD_STORIES.filter(s=>
    (FILTER.type==="all"||s.type===FILTER.type)&&
    (!FILTER.assignee||String(s.assignedTo?.id)===String(FILTER.assignee))&&
    (!FILTER.q||(s.name+" "+s.number+" "+(s.module||"")).toLowerCase().includes(FILTER.q.toLowerCase())));
  for(const st of STATUSES){
    const items=vis.filter(s=>s.storyStatus===st);
    const cnt=$("#cnt-"+stampCls(st)); if(cnt)cnt.textContent=items.length;
    const kn=$("#kn-"+stampCls(st)); if(kn)kn.textContent=items.length;
    const list=$(`.klist[data-status="${st}"]`); if(!list)continue;
    list.innerHTML=items.map(s=>{const od=isPast(s.dueDate)&&st!=="Done";
      const a=BOARD_CRIT.get(s.id);
      return `<div class="card" draggable="true" data-act="open-story" data-id="${s.id}" ${a?.critical?`style="border-color:var(--red);box-shadow:4px 4px 0 var(--red)"`:""}>
      <div class="top"><span class="num">${esc(s.number)}</span>
        ${a?.critical?`<span class="stamp High" style="border-width:2px" title="${esc(a.criticalReasons.join(" · "))}">⚠ CRITICAL</span>`:""}
        <span class="stamp ${stampCls(s.type)}" style="border-width:2px">${esc(s.type)}</span></div>
      <div class="nm">${esc(s.name)}</div>
      <div class="bot"><div class="meta">
        ${s.priority==="High"?'<span style="color:var(--red);font-weight:700">HIGH</span>':""}
        ${s.storyPoints!=null?`<span>${s.storyPoints}pt</span>`:""}
        ${s.dueDate?`<span class="${od?"late":""}">${od?"⚑ ":""}${fmtD(s.dueDate)}</span>`:""}
        ${s.module?`<span>${esc(s.module)}</span>`:""}</div>
      <div class="who" title="${esc(s.assignedTo?.displayName||"unassigned")}">${initials(s.assignedTo?.displayName)}</div></div></div>`;}).join("");
  }
  $$(".card").forEach(c=>{
    c.ondragstart=(e)=>{e.dataTransfer.setData("text/plain",c.dataset.id);c.classList.add("dragging");};
    c.ondragend=()=>c.classList.remove("dragging");
  });
}

// ---------- story drawer ----------
function storyDrawer(s,projectId){
  const d=$("#drawer");
  const isNew=!s;
  const canDelete=!isNew&&ME.role==="ADMIN";
  const tabs=isNew?["details","people"]:["details","people","activity"];
  const tabLabel={details:"Details",people:"People & Files",activity:"Activity"};
  d.innerHTML=`
  <div class="dhead"><span style="display:flex;gap:12px;align-items:center"><span class="num">${isNew?"NEW ITEM":esc(s.number)}</span>
    ${isNew?"":`<span class="stamp ${stampCls(s.type)}">${esc(s.type)}</span><span class="stamp ${stampCls(s.storyStatus)}">${stampLabel(s.storyStatus)}</span>`}</span>
    <button class="bare" data-act="close" style="background:var(--paper);box-shadow:none">✕</button></div>
  <div class="dtabs">${tabs.map((t,i)=>`<button class="dtab ${i===0?"on":""}" data-dtab="${t}">${tabLabel[t]}</button>`).join("")}</div>
  <div class="dbody">
    <div class="dpane" data-pane="details">
      <div class="dsec">
        <div class="dsec-h"><span><i class="sq"></i>Details</span></div>
        <div class="dsec-b">
          <label>Title</label><input id="sn" value="${esc(s?.name||"")}">
          <label>Description</label><textarea id="sd">${esc(s?.description||"")}</textarea>
        </div>
      </div>
      <div class="dsec">
        <div class="dsec-h"><span><i class="sq" style="--sc:var(--blue)"></i>Triage</span></div>
        <div class="dsec-b"><div class="row2">
          <div><label>Type</label><select id="sty">${["Story","Issue","Bug"].map(t=>`<option ${s?.type===t?"selected":""}>${t}</option>`).join("")}</select></div>
          <div><label>Status</label><select id="sst">${STATUSES.map(t=>`<option ${(s?.storyStatus||"Backlog")===t?"selected":""}>${t}</option>`).join("")}</select></div>
          <div><label>Priority</label><select id="spr">${["Low","Medium","High"].map(t=>`<option ${(s?.priority||"Medium")===t?"selected":""}>${t}</option>`).join("")}</select></div>
          <div><label>Points</label><input id="spt" type="number" min="0" value="${s?.storyPoints??""}"></div>
          <div><label>Due date</label><input id="sdd" type="date" value="${s?.dueDate||""}"></div>
          <div><label>Module</label><input id="sm" value="${esc(s?.module||"")}"></div>
        </div></div>
      </div>
    </div>
    <div class="dpane" data-pane="people" hidden>
      <div class="dsec">
        <div class="dsec-h"><span><i class="sq" style="--sc:var(--orange)"></i>People</span></div>
        <div class="dsec-b"><div class="row2">
          <div><label>Assignee</label><select id="sa">${USERS.map(u=>`<option value="${u.id}" ${(s?.assignedTo?.id??ME.id)===u.id?"selected":""}>${esc(u.displayName)}</option>`).join("")}</select></div>
          <div><label>Reporter</label><input value="${esc(s?.reporter?.displayName??ME.displayName)}" disabled title="Reporter is always whoever created the item"></div>
        </div></div>
      </div>
      ${isNew?"":`
      <div class="dsec">
        <div class="dsec-h"><span><i class="sq" style="--sc:var(--red)"></i>Attachments</span><span class="n" id="fcount"></span></div>
        <div class="dsec-b"><div id="flist" style="margin-top:10px"><div class="empty">loading…</div></div>
          <div style="display:flex;gap:10px;margin-top:10px;align-items:center">
            <input type="file" id="fpick" style="border:none;padding:0;background:none">
            <button class="bare" id="fup">Upload</button></div></div>
      </div>`}
    </div>
    ${isNew?"":`
    <div class="dpane" data-pane="activity" hidden>
      <div class="dsec">
        <div class="dsec-h"><span><i class="sq"></i>Comments</span><span class="n" id="ccount"></span></div>
        <div class="dsec-b"><div id="clist" style="margin-top:6px"><div class="empty">loading…</div></div>
          <div style="display:flex;gap:8px;margin-top:10px"><input id="cnew" placeholder="write a comment… (paste a screenshot here)">
            <button class="bare" id="cimg" title="attach image">🖼</button><button class="bare" id="cadd">Post</button></div>
          <input type="file" id="cimgpick" accept="image/*" style="display:none">
          <div id="cpending"></div></div>
      </div>
      <div class="dsec">
        <div class="dsec-h"><span><i class="sq" style="--sc:var(--paper2)"></i>History</span><span class="n" id="hcount"></span></div>
        <div class="dsec-b"><div id="hlist" style="margin-top:6px"><div class="empty">loading…</div></div></div>
      </div>
    </div>`}
  </div>
  <div class="dfoot">
    ${canDelete?`<button class="danger" id="sdel">Delete</button>`:"<span></span>"}
    <button class="primary" id="ssave">${isNew?"Create":"Save"}</button>
  </div>`;
  d.classList.add("open");$("#overlay").classList.add("open");
  $$(".dtab",d).forEach(b=>b.onclick=()=>{
    $$(".dtab",d).forEach(x=>x.classList.toggle("on",x===b));
    $$(".dpane",d).forEach(p=>p.hidden=p.dataset.pane!==b.dataset.dtab);
  });

  if(!isNew){
    let pendingImg=null; // {base64, mime, label}
    const showPending=()=>{$("#cpending").innerHTML=pendingImg?`<div class="pending-img">🖼 ${esc(pendingImg.label)} ready to post <button class="bare" id="cimgx" style="padding:1px 6px">✕</button></div>`:"";
      const x=$("#cimgx"); if(x)x.onclick=()=>{pendingImg=null;showPending();};};
    const fileToPending=(f)=>new Promise((ok)=>{const r=new FileReader();
      r.onload=()=>{pendingImg={base64:r.result.split(",")[1],mime:f.type||"image/png",label:f.name||"screenshot"};showPending();ok();};
      r.readAsDataURL(f);});
    const loadComments=()=>api("/api/pm-comments?storyId="+s.id).then(cs=>{
      $("#ccount").textContent=cs.length?`× ${cs.length}`:"";
      $("#clist").innerHTML=cs.length?cs.map(c=>`<div class="comment">
        <div class="ch"><b>${esc(c.user?.displayName)}</b> · ${fmtD(c.createdDate)}</div>
        ${c.text?`<p>${esc(c.text)}</p>`:""}
        ${c.imageUrl?`<a href="${c.imageUrl}" target="_blank" rel="noopener"><img src="${c.imageUrl}" alt="comment image" loading="lazy"></a>`:""}</div>`).join("")
        :'<div class="empty">No comments</div>';});
    const loadHistory=()=>api("/api/pm-history?storyId="+s.id).then(hs=>{
      $("#hcount").textContent=hs.length?`× ${hs.length}`:"";
      const label={created:"created",storyStatus:"status",assignedTo:"assignee",reporter:"reporter",dueDate:"due date",storyPoints:"points",name:"title",module:"module",type:"type",priority:"priority",description:"description"};
      $("#hlist").innerHTML=hs.length?hs.map(h=>`<div class="hist-row"><span class="ht">${new Date(h.createdDate).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span>
        <span><b>${esc(h.user?.displayName||"—")}</b> ${h.field==="created"?`created <b>${esc(h.newValue)}</b>`
          :h.field==="description"?"updated the description"
          :`changed ${label[h.field]||esc(h.field)}: ${esc(h.oldValue??"—")} <span class="arrow">→</span> <b>${esc(h.newValue??"—")}</b>`}</span></div>`).join("")
        :'<div class="empty">No changes yet</div>';});
    const loadFiles=()=>api("/api/files?storyId="+s.id).then(fs=>{
      $("#fcount").textContent=fs.length?`× ${fs.length}`:"";
      $("#flist").innerHTML=fs.length?fs.map(f=>`<div class="file-row">
        <a href="${f.url}" download>${esc(f.filename)}</a><span class="fs">${fmtSize(f.size)} · ${esc(f.uploadedBy?.displayName||"")}</span>
        <span class="sp"></span>${(ME.role==="ADMIN"||f.uploadedBy?.id===ME.id)?`<button class="bare" data-fdel="${f.id}">✕</button>`:""}</div>`).join("")
        :'<div class="empty">No files</div>';
      $$("[data-fdel]").forEach(b=>b.onclick=async()=>{try{await api("/api/files/"+b.dataset.fdel,{method:"DELETE"});}catch(e){alert(e.message);}loadFiles();});});
    loadComments();loadFiles();loadHistory();
    const postComment=async()=>{
      const t=$("#cnew").value.trim();
      if(!t&&!pendingImg)return;
      await api("/api/pm-comments",{method:"POST",body:JSON.stringify({storyId:s.id,text:t,
        ...(pendingImg?{imageBase64:pendingImg.base64,imageMime:pendingImg.mime}:{})})});
      $("#cnew").value="";pendingImg=null;showPending();loadComments();};
    $("#cadd").onclick=postComment;
    $("#cnew").onkeydown=(e)=>{if(e.key==="Enter")postComment();};
    $("#cnew").onpaste=async(e)=>{
      const item=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));
      if(item){e.preventDefault();await fileToPending(item.getAsFile());}};
    $("#cimg").onclick=()=>$("#cimgpick").click();
    $("#cimgpick").onchange=async()=>{const f=$("#cimgpick").files[0];if(f)await fileToPending(f);$("#cimgpick").value="";};
    $("#fup").onclick=async()=>{
      const f=$("#fpick").files[0]; if(!f){alert("Choose a file first");return;}
      if(f.size>25*1024*1024){alert("Max 25 MB");return;}
      const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(f);});
      $("#fup").textContent="…";
      try{await api("/api/files",{method:"POST",body:JSON.stringify({storyId:s.id,filename:f.name,mime:f.type,dataBase64:b64})});
        $("#fpick").value="";loadFiles();}catch(e){alert(e.message);}
      $("#fup").textContent="Upload";};
    const sdel=$("#sdel");
    if(sdel)sdel.onclick=async()=>{if(!confirm(`Delete ${s.number}?`))return;
      try{await api("/api/pm-stories/"+s.id,{method:"DELETE"});closePanels();render();}catch(e){alert(e.message);}};
  }
  $("#ssave").onclick=async()=>{
    const body={name:$("#sn").value,description:$("#sd").value,module:$("#sm").value,type:$("#sty").value,
      priority:$("#spr").value,storyStatus:$("#sst").value,dueDate:$("#sdd").value||null,
      storyPoints:$("#spt").value===""?null:Number($("#spt").value),
      assignedTo:{id:Number($("#sa").value)},...(isNew?{project:{id:projectId}}:{})};
    try{
      if(isNew) await api("/api/pm-stories",{method:"POST",body:JSON.stringify(body)});
      else await api("/api/pm-stories/"+s.id,{method:"PUT",body:JSON.stringify(body)});
      closePanels();render();
    }catch(e){alert(e.message);}
  };
}

// ---------- team ----------
async function renderTeam(){
  const all=await api("/api/users"); // includes disabled accounts
  $("#main").innerHTML=`
  <div style="display:flex;justify-content:flex-end;margin-bottom:18px"><button class="primary" data-act="new-user">+ Add user</button></div>
  <div class="block"><div class="bhead"><h2>Team</h2><div class="note">${all.filter(u=>u.enabled).length} active · ${all.filter(u=>!u.enabled).length} disabled</div></div>
  <table class="cardify"><thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Last login</th><th>Actions</th></tr></thead><tbody>
  ${all.map(u=>`<tr style="${u.enabled?"":"opacity:.45"}"><td><b>${esc(u.displayName)}</b>${u.enabled?"":" <span class='stamp'>disabled</span>"}</td>
    <td class="mono" data-l="Username">${esc(u.username)}</td>
    <td class="mono" data-l="Email">${esc(u.email||"—")}</td>
    <td data-l="Role"><span class="stamp">${esc(u.role)}</span></td>
    <td class="mono" data-l="Last login">${u.lastLoginAt?fmtD(u.lastLoginAt):"never"}</td>
    <td data-l="" style="white-space:nowrap">
      <button class="bare" data-uedit="${u.id}">edit</button>
      <button class="bare" data-ureset="${u.id}">reset pw</button>
      ${u.id!==ME.id?`<button class="bare" data-utoggle="${u.id}" data-en="${u.enabled?0:1}">${u.enabled?"disable":"enable"}</button>
      <button class="bare" style="color:var(--red)" data-udel="${u.id}" data-name="${esc(u.displayName)}">delete</button>`:""}
    </td></tr>`).join("")}</tbody></table></div>`;
  $$("[data-uedit]").forEach(b=>b.onclick=()=>editUserModal(all.find(u=>u.id===Number(b.dataset.uedit))));
  $$("[data-ureset]").forEach(b=>b.onclick=async()=>{
    const u=all.find(x=>x.id===Number(b.dataset.ureset));
    b.textContent="…";
    try{const r=await api(`/api/users/${u.id}/reset-link`,{method:"POST"});resetLinkModal(u,r);}
    catch(e){alert(e.message);}
    b.textContent="reset pw";});
  $$("[data-utoggle]").forEach(b=>b.onclick=async()=>{
    await api("/api/users/"+b.dataset.utoggle,{method:"PUT",body:JSON.stringify({enabled:b.dataset.en==="1"})});
    USERS=(await api("/api/users")).filter(u=>u.enabled);renderTeam();});
  $$("[data-udel]").forEach(b=>b.onclick=async()=>{
    if(!confirm(`Permanently delete user "${b.dataset.name}"?`))return;
    try{await api("/api/users/"+b.dataset.udel,{method:"DELETE"});
      USERS=(await api("/api/users")).filter(u=>u.enabled);renderTeam();}
    catch(e){alert(e.message);}});
}
function editUserModal(u){
  const m=$("#modal");
  m.innerHTML=`<div class="mhead">Edit ${esc(u.displayName)}</div><div class="mbody">
    <label>Display name</label><input id="eun" value="${esc(u.displayName)}">
    <label>Email</label><input id="eue" type="email" value="${esc(u.email||"")}" placeholder="for invites & resets">
    <label>Role</label><select id="eur">${["DEV","DEVLEAD","ADMIN"].map(r=>`<option ${u.role===r?"selected":""}>${r}</option>`).join("")}</select>
    <label>New password (leave blank to keep)</label><input id="eup" type="text" placeholder="unchanged">
    <div class="formerr" id="eerr"></div></div>
  <div class="mfoot"><button data-act="close">Cancel</button><button class="primary" id="esave">Save</button></div>`;
  m.classList.add("open");$("#overlay").classList.add("open");
  $("#esave").onclick=async()=>{try{
    const body={displayName:$("#eun").value,role:$("#eur").value,email:$("#eue").value||null};
    if($("#eup").value)body.password=$("#eup").value;
    await api("/api/users/"+u.id,{method:"PUT",body:JSON.stringify(body)});
    USERS=(await api("/api/users")).filter(x=>x.enabled);closePanels();renderTeam();
  }catch(e){$("#eerr").textContent=e.message;}};
}
function resetLinkModal(u,r){
  const m=$("#modal");
  m.innerHTML=`<div class="mhead">Password reset — ${esc(u.displayName)}</div><div class="mbody">
    <p style="font-size:13px;margin-top:12px">${r.mailed
      ?`A reset link was <b>emailed to ${esc(u.email)}</b>. It expires in ${r.expiresInMinutes} minutes.`
      :`Share this one-time link with ${esc(u.displayName)} (WhatsApp, mail, anything). Valid ${r.expiresInMinutes} minutes:`}</p>
    <label>Reset link</label><input id="rlink" readonly value="${esc(r.link)}">
    <div style="margin-top:10px"><button class="bare" id="rcopy">Copy link</button></div></div>
  <div class="mfoot"><button class="primary" data-act="close">Done</button></div>`;
  m.classList.add("open");$("#overlay").classList.add("open");
  $("#rcopy").onclick=()=>{$("#rlink").select();navigator.clipboard?.writeText($("#rlink").value);$("#rcopy").textContent="Copied ✓";};
}
function userModal(){
  const m=$("#modal");
  m.innerHTML=`<div class="mhead">Add user</div><div class="mbody">
    <label>Display name</label><input id="un">
    <label>Username (login handle)</label><input id="uu" placeholder="e.g. viral">
    <label>Email (invites &amp; password resets go here)</label><input id="ue" type="email" placeholder="name@company.com">
    <label>Role</label><select id="ur"><option>DEV</option><option>DEVLEAD</option><option>ADMIN</option></select>
    <label>Password (optional — leave blank to send a set-password invite)</label><input id="up" type="text" placeholder="blank = invite link">
    <div class="formerr" id="uerr"></div></div>
  <div class="mfoot"><button data-act="close">Cancel</button><button class="primary" id="usave">Create</button></div>`;
  m.classList.add("open");$("#overlay").classList.add("open");
  $("#usave").onclick=async()=>{try{
    const body={displayName:$("#un").value,username:$("#uu").value,role:$("#ur").value,email:$("#ue").value||null};
    if($("#up").value)body.password=$("#up").value;
    const created=await api("/api/users",{method:"POST",body:JSON.stringify(body)});
    USERS=(await api("/api/users")).filter(u=>u.enabled);
    if(created.inviteLink){
      inviteModal(created);
    }else{closePanels();renderTeam();}
  }catch(e){$("#uerr").textContent=e.message;}};
}
function inviteModal(u){
  const m=$("#modal");
  m.innerHTML=`<div class="mhead">Invite — ${esc(u.displayName)}</div><div class="mbody">
    <p style="font-size:13px;margin-top:12px">${u.mailed
      ?`An invite was <b>emailed to ${esc(u.email)}</b> with a set-password link (valid 72 hours).`
      :`Share this set-password link with ${esc(u.displayName)} (valid 72 hours):`}</p>
    <label>Invite link</label><input id="rlink" readonly value="${esc(u.inviteLink)}">
    <div style="margin-top:10px"><button class="bare" id="rcopy">Copy link</button></div></div>
  <div class="mfoot"><button class="primary" id="idone">Done</button></div>`;
  $("#rcopy").onclick=()=>{$("#rlink").select();navigator.clipboard?.writeText($("#rlink").value);$("#rcopy").textContent="Copied ✓";};
  $("#idone").onclick=()=>{closePanels();renderTeam();};
}

// ---------- access control (admin: which roles see which pages) ----------
const RBAC_PAGE_LABELS={dashboard:"Dashboard",tasks:"All Tasks",command:"Command",products:"Products",clients:"Clients",internal:"Internal Works",team:"Team"};
const RBAC_ROLES=["DEV","DEVLEAD","ADMIN"];
function renderAccess(){
  $("#main").innerHTML=`
  <div class="block"><div class="bhead"><h2>Access Control</h2><div class="note">which roles can see which sections — Admin always has full access</div></div>
  <div class="bpad">
  <table><thead><tr><th>Page</th>${RBAC_ROLES.map(r=>`<th style="text-align:center">${r}</th>`).join("")}</tr></thead><tbody>
  ${Object.keys(RBAC_PAGE_LABELS).map(page=>`<tr>
    <td><b>${esc(RBAC_PAGE_LABELS[page])}</b></td>
    ${RBAC_ROLES.map(role=>`<td style="text-align:center">
      <input type="checkbox" data-rbac="${page}" data-role="${role}" style="width:auto"
        ${role==="ADMIN"?"checked disabled":(RBAC[page]||[]).includes(role)?"checked":""}></td>`).join("")}
    </tr>`).join("")}
  </tbody></table>
  <div class="formerr" id="rbacerr"></div>
  <div style="margin-top:16px"><button class="primary" id="rbacsave">Save changes</button></div>
  </div></div>`;
  $("#rbacsave").onclick=async()=>{
    const body={};
    for(const page of Object.keys(RBAC_PAGE_LABELS)){
      body[page]=RBAC_ROLES.filter(role=>role==="ADMIN"||$(`[data-rbac="${page}"][data-role="${role}"]`).checked);
    }
    try{RBAC=await api("/api/rbac",{method:"PUT",body:JSON.stringify(body)});renderAccess();}
    catch(e){$("#rbacerr").textContent=e.message;}
  };
}

boot();
